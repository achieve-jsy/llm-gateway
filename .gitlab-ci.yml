stages:
  - build
  - migrate
  - deploy
  - verify

variables:
  REGISTRY: "192.0.2.10:5000"
  REGISTRY_LOCAL: "127.0.0.1:5000"
  GATEWAY_IMAGE: "llm-gateway"
  CONTROL_PLANE_IMAGE: "llm-control-plane"
  BACKEND_CI_IMAGE: "llm-ci-backend"
  BACKEND_CI_IMAGE_TAG: "go1.26"
  TEST_HOST: "192.0.2.10"
  TEST_USER: "root"
  TEST_PATH: "/data/llm-gateway"
  TEST_WEB_DIR: "/data/llm-gateway/web"
  PROD_HOST: "192.0.2.10"
  PROD_PATH: "/opt/llm-gateway"
  # Atlas 基线版本（atlas-migrations/20260609082623_baseline.sql 的时间戳）。
  # 首次对“已有 schema 的非空库”执行迁移时，把该版本标记为已应用且不执行其 SQL；
  # revision 表建立后再带此参数为无操作（幂等）。注意：切勿对空库使用，否则不会建表。
  ATLAS_BASELINE: "20260609082623"

# Go 后端变更（触发 gateway + control-plane 构建）
.go-changes: &go-changes
  - "internal/**/*"
  - "cmd/**/*"
  - "go.mod"
  - "go.sum"
  - "config/**/*"
  - "deploy/docker/**/*"

# 前端变更（触发 web 构建）
.web-changes: &web-changes
  - "web/**/*"

# 基础设施变更（触发部署 + 迁移 + 验证）
.infra-changes: &infra-changes
  - "deploy/blue-green/**/*"
  - "docker-compose.yml"
  - "atlas-migrations/**/*"
  - ".gitlab-ci.yml"

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "test"
    - if: $CI_COMMIT_BRANCH == "staging"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ═══════════════════════════════════════════════════════════════════════════════
# BUILD — 测试
# ═══════════════════════════════════════════════════════════════════════════════
build-backend-ci-image-test:
  stage: build
  image: docker:24
  tags: [docker]
  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"
    DOCKER_BUILDKIT: "1"
  script:
    - |
      docker build \
        -f deploy/docker/ci-backend.Dockerfile \
        -t ${REGISTRY}/${BACKEND_CI_IMAGE}:${BACKEND_CI_IMAGE_TAG} \
        .
      docker push ${REGISTRY}/${BACKEND_CI_IMAGE}:${BACKEND_CI_IMAGE_TAG}
  rules:
    - if: $CI_COMMIT_BRANCH == "test"
      changes:
        - "deploy/docker/ci-backend.Dockerfile"

build-backend-test:
  stage: build
  image: ${REGISTRY}/${BACKEND_CI_IMAGE}:${BACKEND_CI_IMAGE_TAG}
  tags: [docker]
  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"
    DOCKER_BUILDKIT: "1"
    BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
    GOCACHE: "/cache/llm-gateway/go-build"
    GOMODCACHE: "/cache/llm-gateway/go-mod"
  script:
    - export IMAGE_TAG="test-${CI_COMMIT_SHORT_SHA}"
    - |
      started_at=$(date +%s)
      step_start=0
      mark_start() { step_start=$(date +%s); }
      mark_done() { now=$(date +%s); echo "TIMING ${1}=$((now - step_start))s"; }

      export PATH="/go/bin:/usr/local/go/bin:${PATH}"
      go version
      go env GOCACHE GOMODCACHE
      docker buildx version

      mark_start
      mkdir -p .backend-dist "$GOCACHE" "$GOMODCACHE"
      CGO_ENABLED=0 go build -mod=vendor -ldflags="-s -w" -o .backend-dist/ ./cmd/gateway ./cmd/control-plane
      mark_done go_build

      mark_start
      mkdir -p .backend-image-context
      cp .backend-dist/gateway .backend-dist/control-plane .backend-image-context/
      cp -R config atlas-migrations .backend-image-context/
      mark_done image_context

      mark_start
      docker build --target gateway --build-arg APP_ENV=test \
        -f deploy/docker/backend.Dockerfile \
        -t ${REGISTRY}/${GATEWAY_IMAGE}:${IMAGE_TAG} .backend-image-context & gateway_build=$!
      docker build --target control-plane --build-arg APP_ENV=test \
        -f deploy/docker/backend.Dockerfile \
        -t ${REGISTRY}/${CONTROL_PLANE_IMAGE}:${IMAGE_TAG} .backend-image-context & cp_build=$!
      wait $gateway_build
      wait $cp_build
      mark_done runtime_build

      mark_start
      docker push ${REGISTRY}/${GATEWAY_IMAGE}:${IMAGE_TAG} & gateway_push=$!
      docker push ${REGISTRY}/${CONTROL_PLANE_IMAGE}:${IMAGE_TAG} & cp_push=$!
      wait $gateway_push
      wait $cp_push
      mark_done image_push

      elapsed=$(( $(date +%s) - started_at ))
      echo "Backend images built and pushed in ${elapsed}s"
  rules:
    - if: $CI_COMMIT_BRANCH == "test"
    - if: $CI_COMMIT_BRANCH == "staging"
      changes: *go-changes
    - if: $CI_COMMIT_BRANCH == "main"
      changes: *go-changes

build-web-test:
  stage: build
  image: node:20-alpine
  tags: [docker]
  retry:
    max: 2
    when:
      - script_failure
      - runner_system_failure
      - stuck_or_timeout_failure
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm-cache"
  cache:
    key:
      files:
        - web/package-lock.json
    paths:
      - .npm-cache/
  script:
    - cd web
    - npm ci --prefer-offline || { sleep 5; npm ci --prefer-offline; }
    - npm run build
    - tar -czf ../web-dist.tar.gz -C dist .
  artifacts:
    paths: [web-dist.tar.gz]
    expire_in: 2 hours
  rules:
    - if: $CI_COMMIT_BRANCH == "test"
    - if: $CI_COMMIT_BRANCH == "staging"
      changes: *web-changes
    - if: $CI_COMMIT_BRANCH == "main"
      changes: *web-changes

# ═══════════════════════════════════════════════════════════════════════════════
# BUILD — 生产
# ═══════════════════════════════════════════════════════════════════════════════
build-backend-prod:
  stage: build
  image: ${REGISTRY}/${BACKEND_CI_IMAGE}:${BACKEND_CI_IMAGE_TAG}
  tags: [docker]
  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"
    DOCKER_BUILDKIT: "1"
    BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
    GOCACHE: "/cache/llm-gateway/go-build"
    GOMODCACHE: "/cache/llm-gateway/go-mod"
  script:
    - export IMAGE_TAG="${CI_COMMIT_TAG}"
    - |
      started_at=$(date +%s)
      step_start=0
      mark_start() { step_start=$(date +%s); }
      mark_done() { now=$(date +%s); echo "TIMING ${1}=$((now - step_start))s"; }

      export PATH="/go/bin:/usr/local/go/bin:${PATH}"
      go version
      go env GOCACHE GOMODCACHE
      docker buildx version

      mark_start
      mkdir -p .backend-dist "$GOCACHE" "$GOMODCACHE"
      CGO_ENABLED=0 go build -mod=vendor -ldflags="-s -w" -o .backend-dist/ ./cmd/gateway ./cmd/control-plane
      mark_done go_build

      mark_start
      mkdir -p .backend-image-context
      cp .backend-dist/gateway .backend-dist/control-plane .backend-image-context/
      cp -R config atlas-migrations .backend-image-context/
      mark_done image_context

      mark_start
      docker build --target gateway --build-arg APP_ENV=prod \
        -f deploy/docker/backend.Dockerfile \
        -t ${REGISTRY}/${GATEWAY_IMAGE}:${IMAGE_TAG} .backend-image-context & gateway_build=$!
      docker build --target control-plane --build-arg APP_ENV=prod \
        -f deploy/docker/backend.Dockerfile \
        -t ${REGISTRY}/${CONTROL_PLANE_IMAGE}:${IMAGE_TAG} .backend-image-context & cp_build=$!
      wait $gateway_build
      wait $cp_build
      mark_done runtime_build

      mark_start
      docker push ${REGISTRY}/${GATEWAY_IMAGE}:${IMAGE_TAG} & gateway_push=$!
      docker push ${REGISTRY}/${CONTROL_PLANE_IMAGE}:${IMAGE_TAG} & cp_push=$!
      wait $gateway_push
      wait $cp_push
      mark_done image_push

      elapsed=$(( $(date +%s) - started_at ))
      echo "Backend images built and pushed in ${elapsed}s"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

build-web-prod:
  stage: build
  image: node:20-alpine
  tags: [docker]
  retry:
    max: 2
    when:
      - script_failure
      - runner_system_failure
      - stuck_or_timeout_failure
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm-cache"
  cache:
    key:
      files:
        - web/package-lock.json
    paths:
      - .npm-cache/
  script:
    - cd web
    - npm ci --prefer-offline || { sleep 5; npm ci --prefer-offline; }
    - npm run build
    - tar -czf ../web-dist.tar.gz -C dist .
  artifacts:
    paths: [web-dist.tar.gz]
    expire_in: 2 hours
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ═══════════════════════════════════════════════════════════════════════════════
# MIGRATE — 数据库迁移（在发布之前自动执行）
#
# prod：库在 192.0.2.10:5433（与 PROD_DATABASE_URL 同库，config/prod.yaml 用 postgres:// 供 Atlas），Runner 内直连执行。
# test：库在测试主机本机（docker-compose host 网络，应用走 127.0.0.1:5432），
#       Runner 无法直连 127.0.0.1，故改为 SSH 到测试主机本机执行迁移。
# ═══════════════════════════════════════════════════════════════════════════════
migrate-prod:
  stage: migrate
  needs: ["build-backend-prod"]
  image: alpine:3.21
  tags: [docker]
  cache:
    key: atlas-bin
    paths:
      - atlas-bin/
  before_script:
    - |
      if [ ! -f atlas-bin/atlas ]; then
        apk add --no-cache curl
        mkdir -p atlas-bin
        curl -sSfL https://release.ariga.io/atlas/atlas-community-linux-amd64-latest -o atlas-bin/atlas
        chmod +x atlas-bin/atlas
      fi
    - cp atlas-bin/atlas /usr/local/bin/atlas
  script:
    - |
      export DATABASE_URL=$(grep -A1 ^database: config/prod.yaml | tail -1 | cut -d'"' -f2)
      echo "Migrating database (prod)..."
      atlas migrate hash --dir "file://atlas-migrations"
      atlas migrate apply --dir "file://atlas-migrations" --url "$DATABASE_URL" --baseline "$ATLAS_BASELINE" --revisions-schema atlas_schema_revisions
  rules:
    # 与 deploy-prod 一致：仅在打 tag 时触发、手动执行（部署前先手动跑迁移）
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: manual

migrate-test:
  stage: migrate
  image: ${REGISTRY}/deploy-tools:latest
  tags: [deploy]
  cache:
    key: atlas-bin
    paths:
      - atlas-bin/
  before_script:
    - |
      if [ ! -f atlas-bin/atlas ]; then
        mkdir -p atlas-bin
        curl -sSfL https://release.ariga.io/atlas/atlas-community-linux-amd64-latest -o atlas-bin/atlas
        chmod +x atlas-bin/atlas
      fi
  script:
    - |
      SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
      # 数据库连接串改由 GitLab CI/CD 变量注入（不再从 config/test.yaml 解析明文）
      DATABASE_URL="${TEST_DATABASE_URL}"
      [ -z "$DATABASE_URL" ] && { echo "ERROR: TEST_DATABASE_URL 未注入（检查 GitLab 变量是否 protected 且 test 分支未受保护）"; exit 1; }
      echo "=== Shipping atlas + migrations to ${TEST_HOST} ==="
      ssh ${SSH_OPTS} ${TEST_USER}@${TEST_HOST} "rm -rf /tmp/atlas-migrate && mkdir -p /tmp/atlas-migrate"
      scp ${SSH_OPTS} atlas-bin/atlas ${TEST_USER}@${TEST_HOST}:/tmp/atlas-migrate/atlas
      scp ${SSH_OPTS} -r atlas-migrations ${TEST_USER}@${TEST_HOST}:/tmp/atlas-migrate/atlas-migrations
      echo "=== Migrating database (test) on ${TEST_HOST} ==="
      ssh ${SSH_OPTS} ${TEST_USER}@${TEST_HOST} "
        set -e
        chmod +x /tmp/atlas-migrate/atlas
        /tmp/atlas-migrate/atlas migrate hash --dir 'file:///tmp/atlas-migrate/atlas-migrations'
        /tmp/atlas-migrate/atlas migrate apply --dir 'file:///tmp/atlas-migrate/atlas-migrations' --url '${DATABASE_URL}' --baseline '${ATLAS_BASELINE}' --exec-order non-linear
        rm -rf /tmp/atlas-migrate
      "
  rules:
    # 仅在 test 分支触发迁移
    - if: $CI_COMMIT_BRANCH == "test"
      when: on_success

# ═══════════════════════════════════════════════════════════════════════════════
# DEPLOY — 测试 (192.0.2.10)
# ═══════════════════════════════════════════════════════════════════════════════
deploy-app-test:
  stage: deploy
  needs: ["build-backend-test", "migrate-test"]
  resource_group: test-app-deploy
  image: ${REGISTRY}/deploy-tools:latest
  tags: [deploy]
  timeout: 15m
  script:
    - |
      SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
      IMAGE_TAG="test-${CI_COMMIT_SHORT_SHA}"
      echo "=== Blue-Green Deploy ${IMAGE_TAG} to ${TEST_HOST} (test) ==="

      # 同步蓝绿部署文件（脚本/compose/upstream）到测试主机
      ssh ${SSH_OPTS} ${TEST_USER}@${TEST_HOST} "mkdir -p ${TEST_PATH}"
      scp ${SSH_OPTS} -r deploy/blue-green/* ${TEST_USER}@${TEST_HOST}:${TEST_PATH}/

      ssh ${SSH_OPTS} ${TEST_USER}@${TEST_HOST} "
        set -e
        cd ${TEST_PATH}
        docker pull ${REGISTRY}/${GATEWAY_IMAGE}:${IMAGE_TAG} & gateway_pull=\$!
        docker pull ${REGISTRY}/${CONTROL_PLANE_IMAGE}:${IMAGE_TAG} & cp_pull=\$!
        wait \$gateway_pull
        wait \$cp_pull
        export IMAGE_TAG=${IMAGE_TAG} REGISTRY=${REGISTRY} APP_ENV=test
        # 蓝绿参数：nginx upstream 走测试机路径；测试环境用短 drain/stop，避免流水线长时间等待
        export NGINX_UPSTREAM=${TEST_PATH}/upstream-active.conf
        export DRAIN_TIMEOUT=10 STOP_TIMEOUT=30 SAFE_SWITCH_ENABLED=true KEEP_OLD_ENV=true
        export NGINX_SMOKE_URL='http://127.0.0.1:9080/health'
        export LEGACY_CONTAINERS='llm-gw-gateway llm-gw-control-plane'
        # 密钥/连接串由 GitLab CI/CD 变量注入到本 SSH 会话，compose 才读得到。
        # 切勿删除这些 export（详见 test-env-config skill）。
        export DATABASE_URL='${TEST_DATABASE_URL}'
        # 可选：配置后用真实探针 Key 额外验证一次（默认用合成 Key 冒烟，不需要此变量）
        export AUTH_SMOKE_KEY='${TEST_AUTH_SMOKE_KEY:-}' AUTH_SMOKE_MODEL='${TEST_AUTH_SMOKE_MODEL:-}'
        export REDIS_ADDR='${TEST_REDIS_ADDR}' REDIS_PASSWORD='${TEST_REDIS_PASSWORD}'
        export REDIS_DB='${TEST_REDIS_DB}'
        export JWT_SECRET='${TEST_JWT_SECRET}'
        export INTERNAL_AUTH_TOKEN='${TEST_INTERNAL_TOKEN}'
        export ENCRYPTION_KEY='${TEST_ENCRYPTION_KEY}'
        export OAUTH_CLIENT_ID='${TEST_OAUTH_CLIENT_ID}' OAUTH_CLIENT_SECRET='${TEST_OAUTH_CLIENT_SECRET}'
        export OAUTH_REDIRECT_URI='http://192.0.2.10:9080/auth/callback'
        export FRONTEND_URL='http://192.0.2.10:9080'
        # 非密钥 canonical 开关：测试环境默认进入安全影子记账，不启用任何阻断。
        export BUDGET_TIER_MASTER_ENABLED=true BUDGET_TIER_ACCOUNTING_ENABLED=true
        export BUDGET_TIER_POSITIVE_ENFORCEMENT_ENABLED=false BUDGET_TIER_ZERO_BLOCK_ENABLED=false
        export BUDGET_TIER_SHADOW_ENABLED=true BUDGET_V2_TOTAL_ENFORCEMENT_ENABLED=false
        export BUDGET_LEGACY_TOTAL_WRITE_ENABLED=true
        export DEV_LOGIN_ENABLED='${TEST_DEV_LOGIN_ENABLED:-false}'
        export DEV_LOGIN_PROD_ALLOWED='${TEST_DEV_LOGIN_PROD_ALLOWED:-false}'
        # 可逆脱敏：默认 detect（只记 privacy_hits，不改写、不需 key_path）。
        # 切 mask：把 TEST_PRIVACY_MODE 设为 mask，并保证密钥文件就位（蓝绿共用），见 docs/redaction.md 七。
        export PRIVACY_MODE='${TEST_PRIVACY_MODE:-detect}' PRIVACY_KEY_PATH='${TEST_PRIVACY_KEY_PATH:-/datalog/privacy-key}'
        bash deploy-blue-green.sh
      "
  environment:
    name: test
    url: http://192.0.2.10:9080
  dependencies: []
  rules:
    - if: $CI_COMMIT_BRANCH == "test"
      when: on_success
    - if: $CI_COMMIT_BRANCH == "test"
      when: on_success

# 测试环境回滚（切回上一个颜色，要求对端仍在运行；手动触发）
rollback-test:
  stage: deploy
  resource_group: test-app-deploy
  image: ${REGISTRY}/deploy-tools:latest
  tags: [deploy]
  timeout: 15m
  script:
    - |
      SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
      echo "=== Rollback test to previous color ==="
      ssh ${SSH_OPTS} ${TEST_USER}@${TEST_HOST} "
        set -e
        cd ${TEST_PATH}
        export REGISTRY=${REGISTRY} APP_ENV=test
        export NGINX_UPSTREAM=${TEST_PATH}/upstream-active.conf
        export DRAIN_TIMEOUT=10 STOP_TIMEOUT=30 SAFE_SWITCH_ENABLED=true KEEP_OLD_ENV=true
        export NGINX_SMOKE_URL='http://127.0.0.1:9080/health'
        export DATABASE_URL='${TEST_DATABASE_URL}'
        # 可选：配置后用真实探针 Key 额外验证一次（默认用合成 Key 冒烟，不需要此变量）
        export AUTH_SMOKE_KEY='${TEST_AUTH_SMOKE_KEY:-}' AUTH_SMOKE_MODEL='${TEST_AUTH_SMOKE_MODEL:-}'
        export REDIS_ADDR='${TEST_REDIS_ADDR}' REDIS_PASSWORD='${TEST_REDIS_PASSWORD}'
        export REDIS_DB='${TEST_REDIS_DB}'
        export JWT_SECRET='${TEST_JWT_SECRET}'
        export INTERNAL_AUTH_TOKEN='${TEST_INTERNAL_TOKEN}'
        export ENCRYPTION_KEY='${TEST_ENCRYPTION_KEY}'
        export OAUTH_CLIENT_ID='${TEST_OAUTH_CLIENT_ID}' OAUTH_CLIENT_SECRET='${TEST_OAUTH_CLIENT_SECRET}'
        export OAUTH_REDIRECT_URI='http://192.0.2.10:9080/auth/callback'
        export FRONTEND_URL='http://192.0.2.10:9080'
        export BUDGET_TIER_MASTER_ENABLED=true BUDGET_TIER_ACCOUNTING_ENABLED=true
        export BUDGET_TIER_POSITIVE_ENFORCEMENT_ENABLED=false BUDGET_TIER_ZERO_BLOCK_ENABLED=false
        export BUDGET_TIER_SHADOW_ENABLED=true BUDGET_V2_TOTAL_ENFORCEMENT_ENABLED=false
        export BUDGET_LEGACY_TOTAL_WRITE_ENABLED=true
        bash deploy-blue-green.sh --rollback
      "
  environment:
    name: test
    url: http://192.0.2.10:9080
  dependencies: []
  rules:
    - if: $CI_COMMIT_BRANCH == "test"
      when: manual
      allow_failure: true

deploy-web-test:
  stage: deploy
  needs: ["build-web-test"]
  image: ${REGISTRY}/deploy-tools:latest
  tags: [deploy]
  script:
    - |
      SSH_OPTS="-o StrictHostKeyChecking=no"
      echo "=== Deploying frontend to ${TEST_HOST}:${TEST_WEB_DIR} ==="
      scp ${SSH_OPTS} web-dist.tar.gz ${TEST_USER}@${TEST_HOST}:/tmp/web-dist.tar.gz
      ssh ${SSH_OPTS} ${TEST_USER}@${TEST_HOST} "
        mkdir -p ${TEST_WEB_DIR}
        tar -xzf /tmp/web-dist.tar.gz -C ${TEST_WEB_DIR}
        rm -f /tmp/web-dist.tar.gz
      "
      echo "=== Frontend deployed to test ==="
  dependencies:
    - build-web-test
  rules:
    - if: $CI_COMMIT_BRANCH == "test"
      when: on_success
    - if: $CI_COMMIT_BRANCH == "test"
      when: on_success

# 快速部署（测试环境）：跳过 Docker 构建/推送/拉取，直接编译 Go 二进制 → SCP → 替换容器内文件
deploy-app-test-fast:
  stage: deploy
  resource_group: test-app-deploy
  image: golang:1.26-alpine
  tags: [docker]
  timeout: 10m
  needs:
    - job: build-backend-test
      optional: true
    - migrate-test
  script:
    - |
      SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
      IMAGE_TAG="test-${CI_COMMIT_SHORT_SHA}"
      echo "=== Fast Deploy: compile + SCP binary directly to ${TEST_HOST} ==="

      # 1. 编译 Go 二进制（静态链接，不需要 Docker）
      apk add --no-cache git ca-certificates
      CGO_ENABLED=0 go build -mod=vendor -ldflags="-s -w" -o /tmp/gateway ./cmd/gateway
      CGO_ENABLED=0 go build -mod=vendor -ldflags="-s -w" -o /tmp/control-plane ./cmd/control-plane

      # 1.5 编译并安装 trace-sealer（宿主机常驻封块器；**不进**任何容器镜像 —— 它直接用
      #     宿主机的 /usr/bin/zstd 与宿主机上的 /datalog）。只安装 + daemon-reload，
      #     **不** enable/start：启用是人工门（读侧就绪 + 挂载在场，见运行手册的硬门）。
      CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -mod=vendor -trimpath -ldflags="-s -w" -o /tmp/trace-sealer ./cmd/trace-sealer
      scp ${SSH_OPTS} /tmp/trace-sealer ${TEST_USER}@${TEST_HOST}:/tmp/trace-sealer.new
      ssh ${SSH_OPTS} ${TEST_USER}@${TEST_HOST} "install -m 0755 /tmp/trace-sealer.new /usr/local/bin/trace-sealer && rm -f /tmp/trace-sealer.new && /usr/local/bin/trace-sealer --version"
      scp ${SSH_OPTS} deploy/systemd/trace-sealer.service ${TEST_USER}@${TEST_HOST}:/etc/systemd/system/trace-sealer.service
      ssh ${SSH_OPTS} ${TEST_USER}@${TEST_HOST} "systemctl daemon-reload"

      # 2. 同步蓝绿部署文件
      ssh ${SSH_OPTS} ${TEST_USER}@${TEST_HOST} "mkdir -p ${TEST_PATH}"
      scp ${SSH_OPTS} -r deploy/blue-green/* ${TEST_USER}@${TEST_HOST}:${TEST_PATH}/

      # 3. 确定目标颜色（当前非活跃的颜色）
      TARGET_COLOR=$(ssh ${SSH_OPTS} ${TEST_USER}@${TEST_HOST} "
        cd ${TEST_PATH}
        if [ -f .active-color ]; then
          case \$(cat .active-color) in
            blue) echo green ;;
            green) echo blue ;;
          esac
        else
          echo green
        fi
      ")
      echo "=== Target color: ${TARGET_COLOR} ==="

      # 4. 启动目标环境（使用现有镜像，后面替换二进制）
      ssh ${SSH_OPTS} ${TEST_USER}@${TEST_HOST} "
        set -e
        cd ${TEST_PATH}
        export IMAGE_TAG=${IMAGE_TAG} REGISTRY=${REGISTRY} APP_ENV=test
        export NGINX_UPSTREAM=${TEST_PATH}/upstream-active.conf
        export DRAIN_TIMEOUT=10 STOP_TIMEOUT=30 SAFE_SWITCH_ENABLED=true KEEP_OLD_ENV=true
        export NGINX_SMOKE_URL='http://127.0.0.1:9080/health'
        export DATABASE_URL='${TEST_DATABASE_URL}'
        # 可选：配置后用真实探针 Key 额外验证一次（默认用合成 Key 冒烟，不需要此变量）
        export AUTH_SMOKE_KEY='${TEST_AUTH_SMOKE_KEY:-}' AUTH_SMOKE_MODEL='${TEST_AUTH_SMOKE_MODEL:-}'
        export REDIS_ADDR='${TEST_REDIS_ADDR}' REDIS_PASSWORD='${TEST_REDIS_PASSWORD}'
        export REDIS_DB='${TEST_REDIS_DB}'
        export JWT_SECRET='${TEST_JWT_SECRET}'
        export INTERNAL_AUTH_TOKEN='${TEST_INTERNAL_TOKEN}'
        export ENCRYPTION_KEY='${TEST_ENCRYPTION_KEY}'
        export OAUTH_CLIENT_ID='${TEST_OAUTH_CLIENT_ID}' OAUTH_CLIENT_SECRET='${TEST_OAUTH_CLIENT_SECRET}'
        export OAUTH_REDIRECT_URI='http://192.0.2.10:9080/auth/callback'
        export FRONTEND_URL='http://192.0.2.10:9080'
        export BUDGET_TIER_MASTER_ENABLED=true BUDGET_TIER_ACCOUNTING_ENABLED=true
        export BUDGET_TIER_POSITIVE_ENFORCEMENT_ENABLED=false BUDGET_TIER_ZERO_BLOCK_ENABLED=false
        export BUDGET_TIER_SHADOW_ENABLED=true BUDGET_V2_TOTAL_ENFORCEMENT_ENABLED=false
        export BUDGET_LEGACY_TOTAL_WRITE_ENABLED=true
        docker compose -f docker-compose.${TARGET_COLOR}.yml -p llm-${TARGET_COLOR} up -d --remove-orphans
      "

      # 5. 等待容器启动
      sleep 5

      # 6. SCP 二进制文件到目标主机，直接 docker cp 进容器
      scp ${SSH_OPTS} /tmp/gateway ${TEST_USER}@${TEST_HOST}:/tmp/gateway-new
      scp ${SSH_OPTS} /tmp/control-plane ${TEST_USER}@${TEST_HOST}:/tmp/control-plane-new

      ssh ${SSH_OPTS} ${TEST_USER}@${TEST_HOST} "
        set -e
        docker cp /tmp/gateway-new llm-${TARGET_COLOR}-gateway-1:/usr/local/bin/gateway
        docker cp /tmp/control-plane-new llm-${TARGET_COLOR}-control-plane-1:/usr/local/bin/control-plane
        rm -f /tmp/gateway-new /tmp/control-plane-new
      "

      # 7. 重启容器（加载新二进制）
      ssh ${SSH_OPTS} ${TEST_USER}@${TEST_HOST} "
        set -e
        cd ${TEST_PATH}
        docker compose -f docker-compose.${TARGET_COLOR}.yml -p llm-${TARGET_COLOR} restart
      "

      # 8. 执行蓝绿切换（健康检查 + nginx 切换 + 停旧环境）
      ssh ${SSH_OPTS} ${TEST_USER}@${TEST_HOST} "
        set -e
        cd ${TEST_PATH}
        export IMAGE_TAG=${IMAGE_TAG} REGISTRY=${REGISTRY} APP_ENV=test
        export NGINX_UPSTREAM=${TEST_PATH}/upstream-active.conf
        export DRAIN_TIMEOUT=10 STOP_TIMEOUT=30 SAFE_SWITCH_ENABLED=true KEEP_OLD_ENV=true
        export NGINX_SMOKE_URL='http://127.0.0.1:9080/health'
        export LEGACY_CONTAINERS='llm-gw-gateway llm-gw-control-plane'
        export DATABASE_URL='${TEST_DATABASE_URL}'
        # 可选：配置后用真实探针 Key 额外验证一次（默认用合成 Key 冒烟，不需要此变量）
        export AUTH_SMOKE_KEY='${TEST_AUTH_SMOKE_KEY:-}' AUTH_SMOKE_MODEL='${TEST_AUTH_SMOKE_MODEL:-}'
        export REDIS_ADDR='${TEST_REDIS_ADDR}' REDIS_PASSWORD='${TEST_REDIS_PASSWORD}'
        export REDIS_DB='${TEST_REDIS_DB}'
        export JWT_SECRET='${TEST_JWT_SECRET}'
        export INTERNAL_AUTH_TOKEN='${TEST_INTERNAL_TOKEN}'
        export ENCRYPTION_KEY='${TEST_ENCRYPTION_KEY}'
        export OAUTH_CLIENT_ID='${TEST_OAUTH_CLIENT_ID}' OAUTH_CLIENT_SECRET='${TEST_OAUTH_CLIENT_SECRET}'
        export OAUTH_REDIRECT_URI='http://192.0.2.10:9080/auth/callback'
        export FRONTEND_URL='http://192.0.2.10:9080'
        export BUDGET_TIER_MASTER_ENABLED=true BUDGET_TIER_ACCOUNTING_ENABLED=true
        export BUDGET_TIER_POSITIVE_ENFORCEMENT_ENABLED=false BUDGET_TIER_ZERO_BLOCK_ENABLED=false
        export BUDGET_TIER_SHADOW_ENABLED=true BUDGET_V2_TOTAL_ENFORCEMENT_ENABLED=false
        export BUDGET_LEGACY_TOTAL_WRITE_ENABLED=true
        # 直接执行 nginx 切换 + 停旧（跳过启动，因为容器已启动）
        bash deploy-blue-green.sh --skip-start
      "
  environment:
    name: test
    url: http://192.0.2.10:9080
  dependencies: []
  rules:
    - if: $CI_COMMIT_BRANCH == "test"
      when: manual
      allow_failure: true

# ═══════════════════════════════════════════════════════════════════════════════
# DEPLOY — 生产 蓝绿部署 (192.0.2.10)
# 流程：推送蓝绿文件 → pull 镜像 → 执行 deploy-blue-green.sh
# drain 等待 600s 让存量 SSE 长连接自然结束，因此 job timeout 需足够长
# ═══════════════════════════════════════════════════════════════════════════════
deploy-prod:
  stage: deploy
  needs: ["build-backend-prod", "migrate-prod"]
  resource_group: production-deploy
  image: ${REGISTRY}/deploy-tools:latest
  tags: [deploy]
  # 常驻双颜色：切流成功后保留旧环境用于快速回滚，不再同步等待 600s drain。
  timeout: 15m
  script:
    - |
      SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
      IMAGE_TAG="$CI_COMMIT_TAG"
      echo "=== Blue-Green Deploy ${IMAGE_TAG} to ${PROD_HOST} (prod) ==="

      # 同步蓝绿部署文件到目标机器
      ssh ${SSH_OPTS} root@${PROD_HOST} "mkdir -p ${PROD_PATH}"
      scp ${SSH_OPTS} -r deploy/blue-green/* root@${PROD_HOST}:${PROD_PATH}/

      # Pull 镜像（并行拉取，失败立即中止）
      ssh ${SSH_OPTS} root@${PROD_HOST} "
        set -e
        docker pull ${REGISTRY}/${GATEWAY_IMAGE}:${IMAGE_TAG} & gateway_pull=\$!
        docker pull ${REGISTRY}/${CONTROL_PLANE_IMAGE}:${IMAGE_TAG} & cp_pull=\$!
        wait \$gateway_pull
        wait \$cp_pull
      "

      # 执行蓝绿部署：新环境稳定 ready 后切流，切流后保留旧颜色用于快速回滚。
      ssh ${SSH_OPTS} root@${PROD_HOST} "
        set -e
        cd ${PROD_PATH}
        export IMAGE_TAG=${IMAGE_TAG} REGISTRY=${REGISTRY} APP_ENV=prod
        export DRAIN_TIMEOUT=600 STOP_TIMEOUT=120 TARGET_REPLACE_TIMEOUT=30
        export HEALTH_RETRIES=30 HEALTH_INTERVAL=2
        export SAFE_SWITCH_ENABLED=true KEEP_OLD_ENV=true DEPLOY_LOCK_TIMEOUT=600
        export READY_STABLE_CHECKS=3 READY_STABLE_INTERVAL=2 READY_MIN_MODEL_COUNT=1 READY_REQUIRE_STABLE_VERSION=true
        export NGINX_SMOKE_URL='http://127.0.0.1:9080/health'
        # 可选：配置后用真实探针 Key 额外验证一次（默认用合成 Key 冒烟，不需要此变量）
        export AUTH_SMOKE_KEY='${PROD_AUTH_SMOKE_KEY:-}' AUTH_SMOKE_MODEL='${PROD_AUTH_SMOKE_MODEL:-}'
        # 可逆脱敏：生产默认 mask（2026-10-30 上线）。要临时降级改 PROD_PRIVACY_MODE=detect/off 重跑。
        # mask 依赖 /datalog/privacy-key（蓝绿共用、0600、不进仓库）；上限 32MB，超限 fail-closed 500。
        export PRIVACY_MODE='${PROD_PRIVACY_MODE:-mask}' PRIVACY_KEY_PATH='${PROD_PRIVACY_KEY_PATH:-/datalog/privacy-key}'
        export PRIVACY_MAX_INPUT_BYTES='${PROD_PRIVACY_MAX_INPUT_BYTES:-33554432}'
        export DATABASE_URL='${PROD_DATABASE_URL}'
        export REDIS_ADDR='${PROD_REDIS_ADDR}' REDIS_DB='${PROD_REDIS_DB}' REDIS_PASSWORD='${PROD_REDIS_PASSWORD}'
        export JWT_SECRET='${PROD_JWT_SECRET}'
        export ENCRYPTION_KEY='${PROD_ENCRYPTION_KEY}'
        export OAUTH_CLIENT_ID='${PROD_OAUTH_CLIENT_ID}' OAUTH_CLIENT_SECRET='${PROD_OAUTH_CLIENT_SECRET}'
        export OAUTH_REDIRECT_URI='${PROD_OAUTH_REDIRECT_URI:-https://aimeter.xk-devops.com/auth/callback}'
        export FRONTEND_URL='${PROD_FRONTEND_URL:-https://aimeter.xk-devops.com}'
        export INTERNAL_AUTH_TOKEN='${PROD_INTERNAL_AUTH_TOKEN}'
        export OAUTH_ISSUER_URL='${PROD_OAUTH_ISSUER_URL:-https://oauth.example.net/}'
        # 生产非密钥开关由受控 CI 变量注入；未配置时 compose 使用安全关闭默认值。
        export BUDGET_TIER_MASTER_ENABLED='${PROD_BUDGET_TIER_MASTER_ENABLED:-false}'
        export BUDGET_TIER_ACCOUNTING_ENABLED='${PROD_BUDGET_TIER_ACCOUNTING_ENABLED:-false}'
        export BUDGET_TIER_POSITIVE_ENFORCEMENT_ENABLED='${PROD_BUDGET_TIER_POSITIVE_ENFORCEMENT_ENABLED:-false}'
        export BUDGET_TIER_ZERO_BLOCK_ENABLED='${PROD_BUDGET_TIER_ZERO_BLOCK_ENABLED:-false}'
        export BUDGET_TIER_SHADOW_ENABLED='${PROD_BUDGET_TIER_SHADOW_ENABLED:-false}'
        export BUDGET_V2_TOTAL_ENFORCEMENT_ENABLED='${PROD_BUDGET_V2_TOTAL_ENFORCEMENT_ENABLED:-false}'
        export BUDGET_LEGACY_TOTAL_WRITE_ENABLED='${PROD_BUDGET_LEGACY_TOTAL_WRITE_ENABLED:-true}'
        # dev-login 双闸：默认关闭。应急登录需在 CI/CD 变量设 PROD_DEV_LOGIN_ENABLED=true
        # 与 PROD_DEV_LOGIN_PROD_ALLOWED=true，用毕移除并重新部署即关闭。
        export DEV_LOGIN_ENABLED='${PROD_DEV_LOGIN_ENABLED:-false}'
        export DEV_LOGIN_PROD_ALLOWED='${PROD_DEV_LOGIN_PROD_ALLOWED:-false}'
        bash deploy-blue-green.sh
      "
  environment:
    name: production
    url: https://aimeter.xk-devops.com
  dependencies: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: manual

# 生产回滚（快速切回上一个颜色，无需重新构建）
rollback-prod:
  stage: deploy
  resource_group: production-deploy
  image: ${REGISTRY}/deploy-tools:latest
  tags: [deploy]
  # 常驻双颜色回滚：只做健康确认 + 原子切流 + nginx 冒烟。
  timeout: 10m
  script:
    - |
      SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
      echo "=== Rollback prod to previous color ==="
      ssh ${SSH_OPTS} root@${PROD_HOST} "
        set -e
        cd ${PROD_PATH}
        export DRAIN_TIMEOUT=600 STOP_TIMEOUT=120 TARGET_REPLACE_TIMEOUT=30
        export HEALTH_RETRIES=30 HEALTH_INTERVAL=2
        export SAFE_SWITCH_ENABLED=true KEEP_OLD_ENV=true DEPLOY_LOCK_TIMEOUT=600
        export READY_STABLE_CHECKS=3 READY_STABLE_INTERVAL=2 READY_MIN_MODEL_COUNT=1 READY_REQUIRE_STABLE_VERSION=true
        export NGINX_SMOKE_URL='http://127.0.0.1:9080/health'
        bash deploy-blue-green.sh --rollback
      "
  environment:
    name: production
    url: https://aimeter.xk-devops.com
  dependencies: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: manual

deploy-web-prod:
  stage: deploy
  needs: ["build-web-prod"]
  image: ${REGISTRY}/deploy-tools:latest
  tags: [deploy]
  variables:
    WEB_DIR: "/data/web/aimeter/dist"
  script:
    - |
      SSH_OPTS="-o StrictHostKeyChecking=no"
      echo "=== Deploying frontend to ${PROD_HOST}:${WEB_DIR} ==="
      scp ${SSH_OPTS} web-dist.tar.gz root@${PROD_HOST}:/tmp/
      ssh ${SSH_OPTS} root@${PROD_HOST} "mkdir -p ${WEB_DIR} && tar -xzf /tmp/web-dist.tar.gz -C ${WEB_DIR} && rm -f /tmp/web-dist.tar.gz"
      echo "=== Frontend deployed to prod ==="
  dependencies:
    - build-web-prod
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: manual

# ═══════════════════════════════════════════════════════════════════════════════
# VERIFY — 测试
# ═══════════════════════════════════════════════════════════════════════════════
verify-test:
  stage: verify
  needs: ["deploy-app-test", "deploy-web-test"]
  image: ${REGISTRY}/deploy-tools:latest
  tags: [deploy]
  script:
    - |
      SSH_OPTS="-o StrictHostKeyChecking=no -o ControlMaster=auto -o ControlPath=/tmp/ssh-control-%r@%h:%p -o ControlPersist=60"
      # 蓝绿感知：按当前活跃颜色校验对应端口
      ssh ${SSH_OPTS} ${TEST_USER}@${TEST_HOST} "
        cd ${TEST_PATH}
        color=\$(cat .active-color 2>/dev/null || echo unknown)
        case \$color in
          blue)  gw=8080; cp=8081 ;;
          green) gw=8082; cp=8083 ;;
          *) echo 'ERROR: unknown active color'; exit 1 ;;
        esac
        echo \"active=\$color gateway=\$gw control-plane=\$cp\"
        curl -fsS --retry 3 --retry-delay 5 http://127.0.0.1:\$gw/health   || { echo 'ERROR: gateway /health failed'; exit 1; }
        curl -fsS --retry 3 --retry-delay 5 http://127.0.0.1:\$cp/healthz  || { echo 'ERROR: control-plane /healthz failed'; exit 1; }
      "
      # 走 nginx 的端到端冒烟（9080 → 活跃 gateway）
      curl -sf --retry 3 --retry-delay 5 http://${TEST_HOST}:9080/health \
        || { echo "ERROR: nginx -> gateway smoke test failed"; exit 1; }
      echo "=== All checks passed ==="
  dependencies: []
  rules:
    - if: $CI_COMMIT_BRANCH == "test"
