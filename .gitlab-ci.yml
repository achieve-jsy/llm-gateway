stages:
  - build
  - deploy
  - verify

variables:
  REGISTRY: "192.0.2.10:5000"
  REGISTRY_LOCAL: "127.0.0.1:5000"
  GATEWAY_IMAGE: "llm-gateway"
  CONTROL_PLANE_IMAGE: "llm-control-plane"
  TEST_HOST: "192.0.2.10"
  TEST_USER: "root"
  TEST_PATH: "/data/llm-gateway"
  TEST_WEB_DIR: "/data/llm-gateway/web"
  PROD_HOST: "192.0.2.10"
  PROD_PATH: "/opt/llm-gateway"
  # Atlas 基线版本（atlas-migrations/20260609082623_baseline.sql 的时间戳）。
  # 首次对“已有 schema 的非空库”执行迁移时，把该版本标记为已应用且不执行其 SQL；
  # revision 表建立后再带此参数为无操作（幂等）。注意：切勿对空库使用，否则不会建表。
  ATLAS_BASELINE: "20260609082623"

# 有实际影响的文件变更（排除 docs/skills/README/.gitignore 等不会影响运行的文件）
.test-significant-changes: &test-significant-changes
  - "internal/**/*"
  - "cmd/**/*"
  - "go.mod"
  - "go.sum"
  - "web/**/*"
  - "deploy/docker/**/*"
  - "deploy/blue-green/**/*"
  - "config/**/*"
  - "docker-compose.yml"
  - "atlas-migrations/**/*"
  - ".gitlab-ci.yml"

# Go 后端变更（触发 gateway + control-plane 构建）
.go-changes: &go-changes
  - "internal/**/*"
  - "cmd/**/*"
  - "go.mod"
  - "go.sum"
  - "config/**/*"
  - "deploy/docker/**/*"

# 前端变更（触发 web 构建）
.web-changes: &web-changes
  - "web/**/*"

# 基础设施变更（触发部署 + 迁移 + 验证）
.infra-changes: &infra-changes
  - "deploy/blue-green/**/*"
  - "docker-compose.yml"
  - "atlas-migrations/**/*"
  - ".gitlab-ci.yml"

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "test"
    - if: $CI_COMMIT_BRANCH == "staging"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ═══════════════════════════════════════════════════════════════════════════════
# BUILD — 测试
# ═══════════════════════════════════════════════════════════════════════════════
build-go-test:
  stage: build
  image: docker:24
  tags: [docker]
  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"
    DOCKER_BUILDKIT: "1"
  script:
    - export IMAGE_TAG="test-${CI_COMMIT_SHORT_SHA}"
    # 统一构建：一个 builder stage 编译 gateway + control-plane，第二次构建命中 Go build cache
    - |
      docker pull ${REGISTRY_LOCAL}/${GATEWAY_IMAGE}:build-cache 2>/dev/null || true
      docker build \
        --cache-from ${REGISTRY_LOCAL}/${GATEWAY_IMAGE}:build-cache \
        --cache-to type=inline \
        --build-arg APP_ENV=test \
        --target gateway-runtime \
        -f deploy/docker/unified.Dockerfile \
        -t ${REGISTRY_LOCAL}/${GATEWAY_IMAGE}:${IMAGE_TAG} \
        .
      docker tag ${REGISTRY_LOCAL}/${GATEWAY_IMAGE}:${IMAGE_TAG} ${REGISTRY_LOCAL}/${GATEWAY_IMAGE}:build-cache
      docker push ${REGISTRY_LOCAL}/${GATEWAY_IMAGE}:build-cache
      docker push ${REGISTRY_LOCAL}/${GATEWAY_IMAGE}:${IMAGE_TAG}
    - |
      docker build \
        --cache-from ${REGISTRY_LOCAL}/${GATEWAY_IMAGE}:build-cache \
        --build-arg APP_ENV=test \
        --target cp-runtime \
        -f deploy/docker/unified.Dockerfile \
        -t ${REGISTRY_LOCAL}/${CONTROL_PLANE_IMAGE}:${IMAGE_TAG} \
        .
      docker push ${REGISTRY_LOCAL}/${CONTROL_PLANE_IMAGE}:${IMAGE_TAG}
  rules:
    - if: $CI_COMMIT_BRANCH == "test"
      changes: *go-changes

build-web-test:
  stage: build
  image: node:20-alpine
  tags: [docker]
  retry:
    max: 2
    when:
      - script_failure
      - runner_system_failure
      - stuck_or_timeout_failure
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm-cache"
  cache:
    key:
      files:
        - web/package-lock.json
    paths:
      - .npm-cache/
  script:
    - cd web
    - npm ci --prefer-offline || { sleep 5; npm ci --prefer-offline; }
    - npm run build
    - tar -czf ../web-dist.tar.gz -C dist .
  artifacts:
    paths: [web-dist.tar.gz]
    expire_in: 2 hours
  rules:
    - if: $CI_COMMIT_BRANCH == "test"
      changes: *web-changes

# ═══════════════════════════════════════════════════════════════════════════════
# BUILD — 生产
# ═══════════════════════════════════════════════════════════════════════════════
build-go-prod:
  stage: build
  image: docker:24
  tags: [docker]
  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"
    DOCKER_BUILDKIT: "1"
  before_script:
    - export IMAGE_TAG="${CI_COMMIT_TAG}"
  script:
    # 统一构建：一个 builder stage 编译 gateway + control-plane，第二次构建命中 Go build cache
    - |
      docker pull ${REGISTRY_LOCAL}/${GATEWAY_IMAGE}:build-cache 2>/dev/null || true
      docker build \
        --cache-from ${REGISTRY_LOCAL}/${GATEWAY_IMAGE}:build-cache \
        --cache-to type=inline \
        --build-arg APP_ENV=prod \
        --target gateway-runtime \
        -f deploy/docker/unified.Dockerfile \
        -t ${REGISTRY_LOCAL}/${GATEWAY_IMAGE}:${IMAGE_TAG} \
        .
      docker tag ${REGISTRY_LOCAL}/${GATEWAY_IMAGE}:${IMAGE_TAG} ${REGISTRY_LOCAL}/${GATEWAY_IMAGE}:build-cache
      docker push ${REGISTRY_LOCAL}/${GATEWAY_IMAGE}:build-cache
      docker push ${REGISTRY_LOCAL}/${GATEWAY_IMAGE}:${IMAGE_TAG}
    - |
      docker build \
        --cache-from ${REGISTRY_LOCAL}/${GATEWAY_IMAGE}:build-cache \
        --build-arg APP_ENV=prod \
        --target cp-runtime \
        -f deploy/docker/unified.Dockerfile \
        -t ${REGISTRY_LOCAL}/${CONTROL_PLANE_IMAGE}:${IMAGE_TAG} \
        .
      docker push ${REGISTRY_LOCAL}/${CONTROL_PLANE_IMAGE}:${IMAGE_TAG}
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

build-web-prod:
  stage: build
  image: node:20-alpine
  tags: [docker]
  retry:
    max: 2
    when:
      - script_failure
      - runner_system_failure
      - stuck_or_timeout_failure
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm-cache"
  cache:
    key:
      files:
        - web/package-lock.json
    paths:
      - .npm-cache/
  script:
    - cd web
    - npm ci --prefer-offline || { sleep 5; npm ci --prefer-offline; }
    - npm run build
    - tar -czf ../web-dist.tar.gz -C dist .
  artifacts:
    paths: [web-dist.tar.gz]
    expire_in: 2 hours
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ═══════════════════════════════════════════════════════════════════════════════
# MIGRATE — 数据库迁移（在发布之前自动执行）
#
# prod：库在 192.0.2.10:5433（与 PROD_DATABASE_URL 同库，config/prod.yaml 用 postgres:// 供 Atlas），Runner 内直连执行。
# test：库在测试主机本机（docker-compose host 网络，应用走 127.0.0.1:5432），
#       Runner 无法直连 127.0.0.1，故改为 SSH 到测试主机本机执行迁移。
# ═══════════════════════════════════════════════════════════════════════════════
migrate-prod:
  stage: deploy
  needs: ["build-go-prod"]
  image: alpine:3.21
  tags: [docker]
  cache:
    key: atlas-bin
    paths:
      - atlas-bin/
  before_script:
    - |
      if [ ! -f atlas-bin/atlas ]; then
        apk add --no-cache curl
        mkdir -p atlas-bin
        curl -sSfL https://release.ariga.io/atlas/atlas-community-linux-amd64-latest -o atlas-bin/atlas
        chmod +x atlas-bin/atlas
      fi
    - cp atlas-bin/atlas /usr/local/bin/atlas
  script:
    - |
      export DATABASE_URL=$(grep -A1 ^database: config/prod.yaml | tail -1 | cut -d'"' -f2)
      echo "Migrating database (prod)..."
      atlas migrate hash --dir "file://atlas-migrations"
      atlas migrate apply --dir "file://atlas-migrations" --url "$DATABASE_URL" --baseline "$ATLAS_BASELINE" --revisions-schema atlas_schema_revisions
  rules:
    # 与 deploy-prod 一致：仅在打 tag 时触发、手动执行（部署前先手动跑迁移）
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: manual

migrate-test:
  stage: build
  image: ${REGISTRY}/deploy-tools:latest
  tags: [deploy]
  cache:
    key: atlas-bin
    paths:
      - atlas-bin/
  before_script:
    - |
      if [ ! -f atlas-bin/atlas ]; then
        mkdir -p atlas-bin
        curl -sSfL https://release.ariga.io/atlas/atlas-community-linux-amd64-latest -o atlas-bin/atlas
        chmod +x atlas-bin/atlas
      fi
  script:
    - |
      SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
      # 数据库连接串改由 GitLab CI/CD 变量注入（不再从 config/test.yaml 解析明文）
      DATABASE_URL="${TEST_DATABASE_URL}"
      [ -z "$DATABASE_URL" ] && { echo "ERROR: TEST_DATABASE_URL 未注入（检查 GitLab 变量是否 protected 且 test 分支未受保护）"; exit 1; }
      echo "=== Shipping atlas + migrations to ${TEST_HOST} ==="
      ssh ${SSH_OPTS} ${TEST_USER}@${TEST_HOST} "rm -rf /tmp/atlas-migrate && mkdir -p /tmp/atlas-migrate"
      scp ${SSH_OPTS} atlas-bin/atlas ${TEST_USER}@${TEST_HOST}:/tmp/atlas-migrate/atlas
      scp ${SSH_OPTS} -r atlas-migrations ${TEST_USER}@${TEST_HOST}:/tmp/atlas-migrate/atlas-migrations
      echo "=== Migrating database (test) on ${TEST_HOST} ==="
      ssh ${SSH_OPTS} ${TEST_USER}@${TEST_HOST} "
        set -e
        chmod +x /tmp/atlas-migrate/atlas
        /tmp/atlas-migrate/atlas migrate hash --dir 'file:///tmp/atlas-migrate/atlas-migrations'
        /tmp/atlas-migrate/atlas migrate apply --dir 'file:///tmp/atlas-migrate/atlas-migrations' --url '${DATABASE_URL}' --baseline '${ATLAS_BASELINE}'
        rm -rf /tmp/atlas-migrate
      "
  rules:
    # 与 deploy-app-test 一致：仅在 test 分支、且有实质变更时才迁移
    - if: $CI_COMMIT_BRANCH == "test"
      changes: *go-changes
      when: on_success
    - if: $CI_COMMIT_BRANCH == "test"
      changes: *infra-changes
      when: on_success

# ═══════════════════════════════════════════════════════════════════════════════
# DEPLOY — 测试 (192.0.2.10)
# ═══════════════════════════════════════════════════════════════════════════════
deploy-app-test:
  stage: deploy
  needs: ["build-go-test", "migrate-test"]
  image: ${REGISTRY}/deploy-tools:latest
  tags: [deploy]
  timeout: 15m
  script:
    - |
      SSH_OPTS="-o StrictHostKeyChecking=no"
      IMAGE_TAG="test-${CI_COMMIT_SHORT_SHA}"
      echo "=== Blue-Green Deploy ${IMAGE_TAG} to ${TEST_HOST} (test) ==="

      # 同步蓝绿部署文件（脚本/compose/upstream）到测试主机
      ssh ${SSH_OPTS} ${TEST_USER}@${TEST_HOST} "mkdir -p ${TEST_PATH}"
      scp ${SSH_OPTS} -r deploy/blue-green/* ${TEST_USER}@${TEST_HOST}:${TEST_PATH}/

      ssh ${SSH_OPTS} ${TEST_USER}@${TEST_HOST} "
        set -e
        cd ${TEST_PATH}
        docker pull ${REGISTRY}/${GATEWAY_IMAGE}:${IMAGE_TAG} || echo 'Gateway image not found, reusing existing'
        docker pull ${REGISTRY}/${CONTROL_PLANE_IMAGE}:${IMAGE_TAG} || echo 'CP image not found, reusing existing'
        export IMAGE_TAG=${IMAGE_TAG} REGISTRY=${REGISTRY} APP_ENV=test
        # 蓝绿参数：nginx upstream 走测试机路径；测试环境用短 drain/stop，避免流水线长时间等待
        export NGINX_UPSTREAM=${TEST_PATH}/upstream-active.conf
        export DRAIN_TIMEOUT=10 STOP_TIMEOUT=30
        export LEGACY_CONTAINERS='llm-gw-gateway llm-gw-control-plane'
        # 密钥/连接串由 GitLab CI/CD 变量注入到本 SSH 会话，compose 才读得到。
        # 切勿删除这些 export（详见 test-env-config skill）。
        export DATABASE_URL='${TEST_DATABASE_URL}'
        export REDIS_ADDR='${TEST_REDIS_ADDR}' REDIS_PASSWORD='${TEST_REDIS_PASSWORD}'
        export REDIS_DB='${TEST_REDIS_DB}'
        export JWT_SECRET='${TEST_JWT_SECRET}'
        export INTERNAL_AUTH_TOKEN='${TEST_INTERNAL_TOKEN}'
        export ENCRYPTION_KEY='${TEST_ENCRYPTION_KEY}'
        export OAUTH_CLIENT_ID='${TEST_OAUTH_CLIENT_ID}' OAUTH_CLIENT_SECRET='${TEST_OAUTH_CLIENT_SECRET}'
        export OAUTH_REDIRECT_URI='http://192.0.2.10:9080/auth/callback'
        export FRONTEND_URL='http://192.0.2.10:9080'
        bash deploy-blue-green.sh
      "
  environment:
    name: test
    url: http://192.0.2.10:9080
  dependencies: []
  rules:
    - if: $CI_COMMIT_BRANCH == "test"
      changes: *go-changes
      when: on_success
    - if: $CI_COMMIT_BRANCH == "test"
      changes: *infra-changes
      when: on_success

# 测试环境回滚（切回上一个颜色，要求对端仍在运行；手动触发）
rollback-test:
  stage: deploy
  image: ${REGISTRY}/deploy-tools:latest
  tags: [deploy]
  timeout: 15m
  script:
    - |
      SSH_OPTS="-o StrictHostKeyChecking=no"
      echo "=== Rollback test to previous color ==="
      ssh ${SSH_OPTS} ${TEST_USER}@${TEST_HOST} "
        set -e
        cd ${TEST_PATH}
        export REGISTRY=${REGISTRY} APP_ENV=test
        export NGINX_UPSTREAM=${TEST_PATH}/upstream-active.conf
        export DRAIN_TIMEOUT=10 STOP_TIMEOUT=30
        export DATABASE_URL='${TEST_DATABASE_URL}'
        export REDIS_ADDR='${TEST_REDIS_ADDR}' REDIS_PASSWORD='${TEST_REDIS_PASSWORD}'
        export REDIS_DB='${TEST_REDIS_DB}'
        export JWT_SECRET='${TEST_JWT_SECRET}'
        export INTERNAL_AUTH_TOKEN='${TEST_INTERNAL_TOKEN}'
        export ENCRYPTION_KEY='${TEST_ENCRYPTION_KEY}'
        export OAUTH_CLIENT_ID='${TEST_OAUTH_CLIENT_ID}' OAUTH_CLIENT_SECRET='${TEST_OAUTH_CLIENT_SECRET}'
        export OAUTH_REDIRECT_URI='http://192.0.2.10:9080/auth/callback'
        export FRONTEND_URL='http://192.0.2.10:9080'
        bash deploy-blue-green.sh --rollback
      "
  environment:
    name: test
    url: http://192.0.2.10:9080
  dependencies: []
  rules:
    - if: $CI_COMMIT_BRANCH == "test"
      when: manual
      allow_failure: true

deploy-web-test:
  stage: deploy
  needs: ["build-web-test"]
  image: ${REGISTRY}/deploy-tools:latest
  tags: [deploy]
  script:
    - |
      SSH_OPTS="-o StrictHostKeyChecking=no"
      echo "=== Deploying frontend to ${TEST_HOST}:${TEST_WEB_DIR} ==="
      scp ${SSH_OPTS} web-dist.tar.gz ${TEST_USER}@${TEST_HOST}:/tmp/web-dist.tar.gz
      ssh ${SSH_OPTS} ${TEST_USER}@${TEST_HOST} "
        mkdir -p ${TEST_WEB_DIR}
        tar -xzf /tmp/web-dist.tar.gz -C ${TEST_WEB_DIR}
        rm -f /tmp/web-dist.tar.gz
      "
      echo "=== Frontend deployed to test ==="
  dependencies:
    - build-web-test
  rules:
    - if: $CI_COMMIT_BRANCH == "test"
      changes: *web-changes
      when: on_success
    - if: $CI_COMMIT_BRANCH == "test"
      changes: *infra-changes
      when: on_success

# 快速部署（测试环境）：跳过 Docker 构建/推送/拉取，直接编译 Go 二进制 → SCP → 替换容器内文件
deploy-app-test-fast:
  stage: deploy
  image: golang:1.26-alpine
  tags: [docker]
  timeout: 10m
  needs:
    - job: build-go-test
      optional: true
    - migrate-test
  script:
    - |
      SSH_OPTS="-o StrictHostKeyChecking=no"
      IMAGE_TAG="test-${CI_COMMIT_SHORT_SHA}"
      echo "=== Fast Deploy: compile + SCP binary directly to ${TEST_HOST} ==="

      # 1. 编译 Go 二进制（静态链接，不需要 Docker）
      apk add --no-cache git ca-certificates
      CGO_ENABLED=0 go build -mod=vendor -ldflags="-s -w" -o /tmp/gateway ./cmd/gateway
      CGO_ENABLED=0 go build -mod=vendor -ldflags="-s -w" -o /tmp/control-plane ./cmd/control-plane

      # 2. 同步蓝绿部署文件
      ssh ${SSH_OPTS} ${TEST_USER}@${TEST_HOST} "mkdir -p ${TEST_PATH}"
      scp ${SSH_OPTS} -r deploy/blue-green/* ${TEST_USER}@${TEST_HOST}:${TEST_PATH}/

      # 3. 确定目标颜色（当前非活跃的颜色）
      TARGET_COLOR=$(ssh ${SSH_OPTS} ${TEST_USER}@${TEST_HOST} "
        cd ${TEST_PATH}
        if [ -f .active-color ]; then
          case \$(cat .active-color) in
            blue) echo green ;;
            green) echo blue ;;
          esac
        else
          echo green
        fi
      ")
      echo "=== Target color: ${TARGET_COLOR} ==="

      # 4. 启动目标环境（使用现有镜像，后面替换二进制）
      ssh ${SSH_OPTS} ${TEST_USER}@${TEST_HOST} "
        set -e
        cd ${TEST_PATH}
        export IMAGE_TAG=${IMAGE_TAG} REGISTRY=${REGISTRY} APP_ENV=test
        export NGINX_UPSTREAM=${TEST_PATH}/upstream-active.conf
        export DRAIN_TIMEOUT=10 STOP_TIMEOUT=30
        export DATABASE_URL='${TEST_DATABASE_URL}'
        export REDIS_ADDR='${TEST_REDIS_ADDR}' REDIS_PASSWORD='${TEST_REDIS_PASSWORD}'
        export REDIS_DB='${TEST_REDIS_DB}'
        export JWT_SECRET='${TEST_JWT_SECRET}'
        export INTERNAL_AUTH_TOKEN='${TEST_INTERNAL_TOKEN}'
        export ENCRYPTION_KEY='${TEST_ENCRYPTION_KEY}'
        export OAUTH_CLIENT_ID='${TEST_OAUTH_CLIENT_ID}' OAUTH_CLIENT_SECRET='${TEST_OAUTH_CLIENT_SECRET}'
        export OAUTH_REDIRECT_URI='http://192.0.2.10:9080/auth/callback'
        export FRONTEND_URL='http://192.0.2.10:9080'
        docker compose -f docker-compose.${TARGET_COLOR}.yml -p llm-${TARGET_COLOR} up -d --remove-orphans
      "

      # 5. 等待容器启动
      sleep 5

      # 6. SCP 二进制文件到目标主机，直接 docker cp 进容器
      scp ${SSH_OPTS} /tmp/gateway ${TEST_USER}@${TEST_HOST}:/tmp/gateway-new
      scp ${SSH_OPTS} /tmp/control-plane ${TEST_USER}@${TEST_HOST}:/tmp/control-plane-new

      ssh ${SSH_OPTS} ${TEST_USER}@${TEST_HOST} "
        set -e
        docker cp /tmp/gateway-new llm-${TARGET_COLOR}-gateway-1:/usr/local/bin/gateway
        docker cp /tmp/control-plane-new llm-${TARGET_COLOR}-control-plane-1:/usr/local/bin/control-plane
        rm -f /tmp/gateway-new /tmp/control-plane-new
      "

      # 7. 重启容器（加载新二进制）
      ssh ${SSH_OPTS} ${TEST_USER}@${TEST_HOST} "
        set -e
        cd ${TEST_PATH}
        docker compose -f docker-compose.${TARGET_COLOR}.yml -p llm-${TARGET_COLOR} restart
      "

      # 8. 执行蓝绿切换（健康检查 + nginx 切换 + 停旧环境）
      ssh ${SSH_OPTS} ${TEST_USER}@${TEST_HOST} "
        set -e
        cd ${TEST_PATH}
        export IMAGE_TAG=${IMAGE_TAG} REGISTRY=${REGISTRY} APP_ENV=test
        export NGINX_UPSTREAM=${TEST_PATH}/upstream-active.conf
        export DRAIN_TIMEOUT=10 STOP_TIMEOUT=30
        export LEGACY_CONTAINERS='llm-gw-gateway llm-gw-control-plane'
        export DATABASE_URL='${TEST_DATABASE_URL}'
        export REDIS_ADDR='${TEST_REDIS_ADDR}' REDIS_PASSWORD='${TEST_REDIS_PASSWORD}'
        export REDIS_DB='${TEST_REDIS_DB}'
        export JWT_SECRET='${TEST_JWT_SECRET}'
        export INTERNAL_AUTH_TOKEN='${TEST_INTERNAL_TOKEN}'
        export ENCRYPTION_KEY='${TEST_ENCRYPTION_KEY}'
        export OAUTH_CLIENT_ID='${TEST_OAUTH_CLIENT_ID}' OAUTH_CLIENT_SECRET='${TEST_OAUTH_CLIENT_SECRET}'
        export OAUTH_REDIRECT_URI='http://192.0.2.10:9080/auth/callback'
        export FRONTEND_URL='http://192.0.2.10:9080'
        # 直接执行 nginx 切换 + 停旧（跳过启动，因为容器已启动）
        bash deploy-blue-green.sh --skip-start
      "
  environment:
    name: test
    url: http://192.0.2.10:9080
  dependencies: []
  rules:
    - if: $CI_COMMIT_BRANCH == "test"
      changes: *go-changes
      when: manual
      allow_failure: true

# ═══════════════════════════════════════════════════════════════════════════════
# DEPLOY — 生产 蓝绿部署 (192.0.2.10)
# 流程：推送蓝绿文件 → pull 镜像 → 执行 deploy-blue-green.sh
# drain 等待 600s 让存量 SSE 长连接自然结束，因此 job timeout 需足够长
# ═══════════════════════════════════════════════════════════════════════════════
deploy-prod:
  stage: deploy
  needs: ["migrate-prod"]
  image: ${REGISTRY}/deploy-tools:latest
  tags: [deploy]
  # 预算：preflight(~2m) + DRAIN_TIMEOUT(600s) + STOP_TIMEOUT(120s) ≈ 14m，留足余量。
  # 旧值 20m 与「drain 600 + stop 600」相等，旧 gateway 停得慢时必超时（部署其实已成功）。
  timeout: 30m
  script:
    - |
      SSH_OPTS="-o StrictHostKeyChecking=no"
      IMAGE_TAG="$CI_COMMIT_TAG"
      echo "=== Blue-Green Deploy ${IMAGE_TAG} to ${PROD_HOST} (prod) ==="

      # 同步蓝绿部署文件到目标机器
      ssh ${SSH_OPTS} root@${PROD_HOST} "mkdir -p ${PROD_PATH}"
      scp ${SSH_OPTS} -r deploy/blue-green/* root@${PROD_HOST}:${PROD_PATH}/

      # Pull 镜像
      ssh ${SSH_OPTS} root@${PROD_HOST} "
        docker pull ${REGISTRY}/${GATEWAY_IMAGE}:${IMAGE_TAG}
        docker pull ${REGISTRY}/${CONTROL_PLANE_IMAGE}:${IMAGE_TAG}
      "

      # 执行蓝绿部署（脚本内包含 600s drain 等待）
      ssh ${SSH_OPTS} root@${PROD_HOST} "
        set -e
        cd ${PROD_PATH}
        export IMAGE_TAG=${IMAGE_TAG} REGISTRY=${REGISTRY} APP_ENV=prod
        # 旧环境经 600s drain 后已无新流量，停它不需再等 600s（默认值），
        # 否则 drain 600 + stop 600 = 20m 撑满 job timeout，导致部署成功但 job 报错。
        export DRAIN_TIMEOUT=600 STOP_TIMEOUT=120
        export DATABASE_URL='${PROD_DATABASE_URL}'
        export REDIS_ADDR='${PROD_REDIS_ADDR}' REDIS_DB='${PROD_REDIS_DB}' REDIS_PASSWORD='${PROD_REDIS_PASSWORD}'
        export JWT_SECRET='${PROD_JWT_SECRET}'
        export ENCRYPTION_KEY='${PROD_ENCRYPTION_KEY}'
        export OAUTH_CLIENT_ID='${PROD_OAUTH_CLIENT_ID}' OAUTH_CLIENT_SECRET='${PROD_OAUTH_CLIENT_SECRET}'
        export OAUTH_REDIRECT_URI='${PROD_OAUTH_REDIRECT_URI:-https://aimeter.xk-devops.com/auth/callback}'
        export FRONTEND_URL='${PROD_FRONTEND_URL:-https://aimeter.xk-devops.com}'
        export INTERNAL_AUTH_TOKEN='${PROD_INTERNAL_AUTH_TOKEN}'
        export OAUTH_ISSUER_URL='${PROD_OAUTH_ISSUER_URL:-https://oauth.example.net/}'
        bash deploy-blue-green.sh
      "
  environment:
    name: production
    url: https://aimeter.xk-devops.com
  dependencies: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: manual

# 生产回滚（快速切回上一个颜色，无需重新构建）
rollback-prod:
  stage: deploy
  image: ${REGISTRY}/deploy-tools:latest
  tags: [deploy]
  # 预算：DRAIN_TIMEOUT(600s) + STOP_TIMEOUT(120s) + preflight ≈ 13m，留足余量。
  timeout: 20m
  script:
    - |
      SSH_OPTS="-o StrictHostKeyChecking=no"
      echo "=== Rollback prod to previous color ==="
      ssh ${SSH_OPTS} root@${PROD_HOST} "
        set -e
        cd ${PROD_PATH}
        # 同 deploy-prod：drain 后旧环境已空闲，停它无需默认 600s（否则会撑爆 timeout）。
        export DRAIN_TIMEOUT=600 STOP_TIMEOUT=120
        bash deploy-blue-green.sh --rollback
      "
  environment:
    name: production
    url: https://aimeter.xk-devops.com
  dependencies: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: manual

deploy-web-prod:
  stage: deploy
  needs: ["build-web-prod"]
  image: ${REGISTRY}/deploy-tools:latest
  tags: [deploy]
  variables:
    WEB_DIR: "/data/web/aimeter/dist"
  script:
    - |
      SSH_OPTS="-o StrictHostKeyChecking=no"
      echo "=== Deploying frontend to ${PROD_HOST}:${WEB_DIR} ==="
      scp ${SSH_OPTS} web-dist.tar.gz root@${PROD_HOST}:/tmp/
      ssh ${SSH_OPTS} root@${PROD_HOST} "mkdir -p ${WEB_DIR} && tar -xzf /tmp/web-dist.tar.gz -C ${WEB_DIR} && rm -f /tmp/web-dist.tar.gz"
      echo "=== Frontend deployed to prod ==="
  dependencies:
    - build-web-prod
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: manual

# ═══════════════════════════════════════════════════════════════════════════════
# VERIFY — 测试
# ═══════════════════════════════════════════════════════════════════════════════
verify-test:
  stage: verify
  needs: ["deploy-app-test", "deploy-web-test"]
  image: ${REGISTRY}/deploy-tools:latest
  tags: [deploy]
  script:
    - |
      SSH_OPTS="-o StrictHostKeyChecking=no -o ControlMaster=auto -o ControlPath=/tmp/ssh-control-%r@%h:%p -o ControlPersist=60"
      # 蓝绿感知：按当前活跃颜色校验对应端口
      ssh ${SSH_OPTS} ${TEST_USER}@${TEST_HOST} "
        cd ${TEST_PATH}
        color=\$(cat .active-color 2>/dev/null || echo unknown)
        case \$color in
          blue)  gw=8080; cp=8081 ;;
          green) gw=8082; cp=8083 ;;
          *) echo 'ERROR: unknown active color'; exit 1 ;;
        esac
        echo \"active=\$color gateway=\$gw control-plane=\$cp\"
        curl -fsS --retry 3 --retry-delay 5 http://127.0.0.1:\$gw/health   || { echo 'ERROR: gateway /health failed'; exit 1; }
        curl -fsS --retry 3 --retry-delay 5 http://127.0.0.1:\$cp/healthz  || { echo 'ERROR: control-plane /healthz failed'; exit 1; }
      "
      # 走 nginx 的端到端冒烟（9080 → 活跃 gateway）
      curl -sf --retry 3 --retry-delay 5 http://${TEST_HOST}:9080/health \
        || { echo "ERROR: nginx -> gateway smoke test failed"; exit 1; }
      echo "=== All checks passed ==="
  dependencies: []
  rules:
    - if: $CI_COMMIT_BRANCH == "test"
      changes: *go-changes
    - if: $CI_COMMIT_BRANCH == "test"
      changes: *infra-changes
