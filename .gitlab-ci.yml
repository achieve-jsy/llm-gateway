# ═══════════════════════════════════════════════════════════════════════════════
# CI/CD Pipeline for LLM Gateway (dev branch)
#
# 流程：test → build（3 个服务并行构建） → deploy（手动触发）
#
# 部署到 192.0.2.10，使用 docker compose 运行全部服务
# ═══════════════════════════════════════════════════════════════════════════════

stages:
  - test
  - build
  - deploy

variables:
  GATEWAY_IMAGE: "llm-gateway:${CI_COMMIT_SHORT_SHA}"
  CP_IMAGE: "llm-control-plane:${CI_COMMIT_SHORT_SHA}"
  WEB_IMAGE: "llm-web:${CI_COMMIT_SHORT_SHA}"

# ─── Test Stage ─────────────────────────────────────────────────────────────────
test:
  stage: test
  image: golang:1.23
  tags: [deploy, go, docker]
  script:
    - go vet ./...
    - go test ./... -race -cover -count=1
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ─── Build Stage: Gateway ──────────────────────────────────────────────────────
build-gateway:
  stage: build
  image: docker:24
  tags: [deploy, go, docker]
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_VERIFY: "1"
  script:
    - docker build -f deploy/docker/gateway.Dockerfile -t ${GATEWAY_IMAGE} .
    - docker save ${GATEWAY_IMAGE} -o gateway.tar
  artifacts:
    paths:
      - gateway.tar
    expire_in: 2 hours
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "main"

# ─── Build Stage: Control Plane ────────────────────────────────────────────────
build-control-plane:
  stage: build
  image: docker:24
  tags: [deploy, go, docker]
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_VERIFY: "1"
  script:
    - docker build -f deploy/docker/control-plane.Dockerfile -t ${CP_IMAGE} .
    - docker save ${CP_IMAGE} -o control-plane.tar
  artifacts:
    paths:
      - control-plane.tar
    expire_in: 2 hours
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "main"

# ─── Build Stage: Web ──────────────────────────────────────────────────────────
build-web:
  stage: build
  image: docker:24
  tags: [deploy, go, docker]
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_VERIFY: "1"
  script:
    - docker build -f deploy/docker/web.Dockerfile -t ${WEB_IMAGE} .
    - docker save ${WEB_IMAGE} -o web.tar
  artifacts:
    paths:
      - web.tar
    expire_in: 2 hours
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "main"

# ─── Deploy Stage ──────────────────────────────────────────────────────────────
deploy:
  stage: deploy
  image: alpine:latest
  tags: [deploy, go, docker]
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$DEPLOY_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H ${DEPLOY_HOST:-192.0.2.10} >> ~/.ssh/known_hosts
  script:
    - |
      DEPLOY_PATH="/opt/llm-gateway"
      ssh root@${DEPLOY_HOST:-192.0.2.10} "mkdir -p ${DEPLOY_PATH}"

    # 传输镜像文件
    - scp gateway.tar control-plane.tar web.tar root@${DEPLOY_HOST:-192.0.2.10}:${DEPLOY_PATH}/

    # 传输部署文件
    - scp docker-compose.yml .env.example root@${DEPLOY_HOST:-192.0.2.10}:${DEPLOY_PATH}/
    - scp deploy/docker/nginx.conf root@${DEPLOY_HOST:-192.0.2.10}:${DEPLOY_PATH}/

    # 远程执行：加载镜像、打 tag、启动服务
    - |
      ssh root@${DEPLOY_HOST:-192.0.2.10} << 'REMOTE_SCRIPT'
        set -e
        cd /opt/llm-gateway

        # 加载镜像
        docker load -i gateway.tar
        docker load -i control-plane.tar
        docker load -i web.tar

        # 重命名为 latest tag（compose 文件中使用）
        docker tag ${GATEWAY_IMAGE} llm-gateway:latest
        docker tag ${CP_IMAGE} llm-control-plane:latest
        docker tag ${WEB_IMAGE} llm-web:latest

        # 清理 tar 文件
        rm -f gateway.tar control-plane.tar web.tar

        # 启动服务（如果 .env 不存在则从 .env.example 复制）
        [ ! -f .env ] && cp .env.example .env && echo "WARN: Created .env from .env.example, please edit with real values"

        # 使用本地构建的镜像，跳过 build 步骤
        IMAGE_TAG=latest docker compose up -d --remove-orphans

        echo "Deploy complete. Services:"
        docker compose ps
      REMOTE_SCRIPT
  environment:
    name: production
    url: http://${DEPLOY_HOST:-192.0.2.10}
  when: manual
  dependencies:
    - build-gateway
    - build-control-plane
    - build-web
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "main"
