# ═══════════════════════════════════════════════════════════════════════════════
# CI/CD Pipeline for LLM Gateway
#
# 触发方式：
#   - git tag vX.Y.Z → 全流程（test → build → deploy → verify）
#   - dev/main 分支 push → 仅 test + build（不部署）
#
# 架构：
#   ops (192.0.2.10): GitLab Runner + Docker Registry (:5000)
#   prod (192.0.2.10): docker compose 部署
# ═══════════════════════════════════════════════════════════════════════════════

stages:
  - test
  - build
  - deploy
  - verify

variables:
  REGISTRY: "192.0.2.10:5000"
  # tag 触发时用 tag 名；分支触发时用 commit SHA
  IMAGE_TAG: "${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}"
  GATEWAY_IMAGE: "${REGISTRY}/llm-gateway:${IMAGE_TAG}"
  CP_IMAGE: "${REGISTRY}/llm-control-plane:${IMAGE_TAG}"
  WEB_IMAGE: "${REGISTRY}/llm-web:${IMAGE_TAG}"
  DEPLOY_HOST: "192.0.2.10"
  DEPLOY_PATH: "/opt/llm-gateway"

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/      # 语义化版本 tag
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ─── Test Stage ─────────────────────────────────────────────────────────────
test:
  stage: test
  image: golang:1.23-alpine
  tags: [go]
  script:
    - go vet ./...
    - go test ./... -race -cover -count=1 -timeout 5m
  allow_failure: true
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

# ─── Build Stage ────────────────────────────────────────────────────────────
.build_template: &build_template
  stage: build
  image: docker:24
  tags: [docker]
  before_script:
    - docker login -u "" -p "" ${REGISTRY} || true
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "main"

build-gateway:
  <<: *build_template
  script:
    - docker build -f deploy/docker/gateway.Dockerfile -t ${GATEWAY_IMAGE} .
    - docker push ${GATEWAY_IMAGE}
    # tag 触发时额外打 latest
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag ${GATEWAY_IMAGE} ${REGISTRY}/llm-gateway:latest
        docker push ${REGISTRY}/llm-gateway:latest
      fi

build-control-plane:
  <<: *build_template
  script:
    - docker build -f deploy/docker/control-plane.Dockerfile -t ${CP_IMAGE} .
    - docker push ${CP_IMAGE}
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag ${CP_IMAGE} ${REGISTRY}/llm-control-plane:latest
        docker push ${REGISTRY}/llm-control-plane:latest
      fi

build-web:
  <<: *build_template
  script:
    - docker build -f deploy/docker/web.Dockerfile -t ${WEB_IMAGE} .
    - docker push ${WEB_IMAGE}
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag ${WEB_IMAGE} ${REGISTRY}/llm-web:latest
        docker push ${REGISTRY}/llm-web:latest
      fi

# ─── Deploy Stage ───────────────────────────────────────────────────────────
# tag 触发时自动部署；分支触发时手动
deploy:
  stage: deploy
  image: alpine:latest
  tags: [deploy]
  before_script:
    - apk add --no-cache openssh-client curl
    - eval $(ssh-agent -s)
    - echo "$DEPLOY_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H ${DEPLOY_HOST} >> ~/.ssh/known_hosts
  script:
    - |
      # 准备远程部署目录
      ssh root@${DEPLOY_HOST} "mkdir -p ${DEPLOY_PATH}"

      # 传输部署文件
      scp docker-compose.yml root@${DEPLOY_HOST}:${DEPLOY_PATH}/
      scp deploy/docker/nginx.conf root@${DEPLOY_HOST}:${DEPLOY_PATH}/
      [ -f .env.example ] && scp .env.example root@${DEPLOY_HOST}:${DEPLOY_PATH}/

      # 远程部署
      ssh root@${DEPLOY_HOST} << REMOTE_SCRIPT
        set -e
        cd ${DEPLOY_PATH}

        # 设置镜像 tag
        export IMAGE_TAG="${IMAGE_TAG}"

        # 从 Registry 拉取新镜像
        docker pull ${GATEWAY_IMAGE}
        docker pull ${CP_IMAGE}
        docker pull ${WEB_IMAGE}

        # tag 为本地名称（compose 文件引用）
        docker tag ${GATEWAY_IMAGE} llm-gateway:${IMAGE_TAG}
        docker tag ${CP_IMAGE} llm-control-plane:${IMAGE_TAG}
        docker tag ${WEB_IMAGE} llm-web:${IMAGE_TAG}

        # 如果 .env 不存在则从 example 复制
        [ ! -f .env ] && cp .env.example .env && echo "WARN: Created .env from .env.example"

        # 滚动更新：先起新容器再停旧容器
        IMAGE_TAG=${IMAGE_TAG} docker compose up -d --remove-orphans --wait --wait-timeout 60

        echo "=== Deploy ${IMAGE_TAG} complete ==="
        docker compose ps
      REMOTE_SCRIPT
  environment:
    name: production
    url: http://${DEPLOY_HOST}
  dependencies:
    - build-gateway
    - build-control-plane
    - build-web
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success           # tag → 自动部署
    - if: $CI_COMMIT_BRANCH == "dev"
      when: manual               # 分支 → 手动部署
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual

# ─── Verify Stage ───────────────────────────────────────────────────────────
verify:
  stage: verify
  image: alpine:latest
  tags: [deploy]
  script:
    - apk add --no-cache curl
    - echo "Waiting for services to stabilize..."
    - sleep 15
    - |
      echo "Checking gateway health..."
      curl -sf http://${DEPLOY_HOST}:80/health || curl -sf http://${DEPLOY_HOST}:8080/health || {
        echo "ERROR: Gateway health check failed"
        exit 1
      }
      echo " ✓ Gateway healthy"
    - |
      echo "Checking control-plane health..."
      curl -sf http://${DEPLOY_HOST}:80/api/v1/provider-definitions || curl -sf http://${DEPLOY_HOST}:8081/api/v1/provider-definitions || {
        echo "ERROR: Control-plane health check failed"
        exit 1
      }
      echo " ✓ Control-plane healthy"
    - echo "=== All services verified for ${IMAGE_TAG} ==="
  dependencies: []
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "dev"
      when: manual
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
