# ═══════════════════════════════════════════════════════════════════════════════
# CI/CD Pipeline for LLM Gateway (dev branch)
#
# 流程：test → build（3 个服务并行） → deploy（手动触发）
#
# 架构：
#   - CI 服务器 (192.0.2.10) 有本地 Docker Registry (:5000)
#   - Build 阶段直接用宿主机 Docker 构建（通过 Docker socket）
#   - 镜像推送到 Registry，deploy 阶段从 Registry 拉取
#   - 部署到 192.0.2.10，使用 docker compose
# ═══════════════════════════════════════════════════════════════════════════════

stages:
  - test
  - build
  - deploy

variables:
  REGISTRY: "192.0.2.10:5000"
  GATEWAY_IMAGE: "${REGISTRY}/llm-gateway:${CI_COMMIT_SHORT_SHA}"
  CP_IMAGE: "${REGISTRY}/llm-control-plane:${CI_COMMIT_SHORT_SHA}"
  WEB_IMAGE: "${REGISTRY}/llm-web:${CI_COMMIT_SHORT_SHA}"

# ─── Test Stage ─────────────────────────────────────────────────────────────
test:
  stage: test
  image: golang:1.23-alpine
  tags: [deploy, go, docker]
  script:
    - go vet ./...
    - go test ./... -race -cover -count=1
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ─── Build Stage ────────────────────────────────────────────────────────────
# 使用 docker:24 镜像 + 宿主机 Docker socket（已在 Runner volumes 配置）
# 这样不需要 DinD（privileged mode），构建速度更快更稳定

.build_template: &build_template
  stage: build
  image: docker:24
  tags: [deploy, go, docker]
  before_script:
    - docker login -u "" -p "" ${REGISTRY} || true  # 本地 registry 无需认证
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "main"

build-gateway:
  <<: *build_template
  script:
    - docker build -f deploy/docker/gateway.Dockerfile -t ${GATEWAY_IMAGE} .
    - docker push ${GATEWAY_IMAGE}

build-control-plane:
  <<: *build_template
  script:
    - docker build -f deploy/docker/control-plane.Dockerfile -t ${CP_IMAGE} .
    - docker push ${CP_IMAGE}

build-web:
  <<: *build_template
  script:
    - docker build -f deploy/docker/web.Dockerfile -t ${WEB_IMAGE} .
    - docker push ${WEB_IMAGE}

# ─── Deploy Stage ───────────────────────────────────────────────────────────
deploy:
  stage: deploy
  image: alpine:latest
  tags: [deploy, go, docker]
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$DEPLOY_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H ${DEPLOY_HOST:-192.0.2.10} >> ~/.ssh/known_hosts
  script:
    - |
      DEPLOY_HOST="${DEPLOY_HOST:-192.0.2.10}"
      DEPLOY_PATH="/opt/llm-gateway"

      # 传输部署文件
      scp docker-compose.yml .env.example ${DEPLOY_HOST}:/tmp/llm-deploy/
      scp deploy/docker/nginx.conf ${DEPLOY_HOST}:/tmp/llm-deploy/

      # 远程执行：从 Registry 拉取镜像、启动服务
      ssh root@${DEPLOY_HOST} << REMOTE_SCRIPT
        set -e
        mkdir -p ${DEPLOY_PATH}
        cd ${DEPLOY_PATH}

        # 移动部署文件
        mv /tmp/llm-deploy/docker-compose.yml . 2>/dev/null || true
        mv /tmp/llm-deploy/nginx.conf . 2>/dev/null || true
        mv /tmp/llm-deploy/.env.example . 2>/dev/null || true

        # 从 Registry 拉取镜像
        docker pull ${GATEWAY_IMAGE}
        docker pull ${CP_IMAGE}
        docker pull ${WEB_IMAGE}

        # 重命名为 latest（compose 文件中使用）
        docker tag ${GATEWAY_IMAGE} llm-gateway:latest
        docker tag ${CP_IMAGE} llm-control-plane:latest
        docker tag ${WEB_IMAGE} llm-web:latest

        # 如果 .env 不存在则从 example 复制
        [ ! -f .env ] && cp .env.example .env && echo "WARN: Created .env from example, please edit"

        # 启动服务
        IMAGE_TAG=latest docker compose up -d --remove-orphans

        echo "=== Deploy complete ==="
        docker compose ps
      REMOTE_SCRIPT
  environment:
    name: production
    url: http://${DEPLOY_HOST:-192.0.2.10}
  when: manual
  dependencies:
    - build-gateway
    - build-control-plane
    - build-web
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "main"
