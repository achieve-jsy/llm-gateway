# ═══════════════════════════════════════════════════════════════════════════════
# CI/CD Pipeline for LLM Gateway
#
# 触发方式：
#   - git tag vX.Y.Z → 全流程（test → build → deploy → verify）
#   - dev/main 分支 push → 仅 test + build（不部署）
#
# 架构：
#   ops (192.0.2.10): GitLab Runner (Docker executor, socket mount)
#   prod (192.0.2.10): docker compose 部署
#
# Build 策略：docker save → artifact → scp → docker load（无需 registry）
# ═══════════════════════════════════════════════════════════════════════════════

stages:
  - test
  - build
  - deploy
  - verify

variables:
  DEPLOY_HOST: "192.0.2.10"
  DEPLOY_PATH: "/opt/llm-gateway"

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ─── Test Stage ─────────────────────────────────────────────────────────────
test:
  stage: test
  image: 192.0.2.10:5000/golang:1.26-alpine
  tags: [go]
  variables:
    GOPROXY: "https://goproxy.cn,direct"
    GONOSUMCHECK: "*"
  script:
    - go vet ./...
    - go test ./... -cover -count=1 -timeout 5m
  allow_failure: true
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"

# ─── Build Stage ────────────────────────────────────────────────────────────
# Runner 挂载了 /var/run/docker.sock，无需 dind service
# Build → docker save → artifact（绕开 registry push 问题）
.build_template: &build_template
  stage: build
  image: docker:24
  tags: [docker]
  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"
  before_script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        export IMAGE_TAG="$CI_COMMIT_TAG"
      else
        export IMAGE_TAG="$CI_COMMIT_SHORT_SHA"
      fi
      echo "IMAGE_TAG=${IMAGE_TAG}"
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "main"

build-gateway:
  <<: *build_template
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        IMAGE_TAG="$CI_COMMIT_TAG"
      else
        IMAGE_TAG="$CI_COMMIT_SHORT_SHA"
      fi
      echo "Building llm-gateway:${IMAGE_TAG} ..."
      docker build -f deploy/docker/gateway.Dockerfile -t llm-gateway:${IMAGE_TAG} .
      docker save llm-gateway:${IMAGE_TAG} | gzip > gateway.tar.gz
      ls -lh gateway.tar.gz
  artifacts:
    paths: [gateway.tar.gz]
    expire_in: 2 hours

build-control-plane:
  <<: *build_template
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        IMAGE_TAG="$CI_COMMIT_TAG"
      else
        IMAGE_TAG="$CI_COMMIT_SHORT_SHA"
      fi
      echo "Building llm-control-plane:${IMAGE_TAG} ..."
      docker build -f deploy/docker/control-plane.Dockerfile -t llm-control-plane:${IMAGE_TAG} .
      docker save llm-control-plane:${IMAGE_TAG} | gzip > control-plane.tar.gz
      ls -lh control-plane.tar.gz
  artifacts:
    paths: [control-plane.tar.gz]
    expire_in: 2 hours

# ─── Deploy Test (192.0.2.10) ─────────────────────────────────────────────
deploy-test:
  stage: deploy
  image: alpine:latest
  tags: [deploy]
  variables:
    TEST_HOST: "192.0.2.10"
    TEST_PATH: "/opt/llm-gateway"
    GATEWAY_PORT: "4010"
    CONTROL_PLANE_PORT: "4011"
  before_script:
    - apk add --no-cache openssh-client curl
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        export IMAGE_TAG="$CI_COMMIT_TAG"
      else
        export IMAGE_TAG="$CI_COMMIT_SHORT_SHA"
      fi
  script:
    - |
      SSH_OPTS="-o StrictHostKeyChecking=no"
      echo "=== Deploying IMAGE_TAG=${IMAGE_TAG} to ${TEST_HOST} (test) ==="

      # 传输镜像文件
      scp ${SSH_OPTS} gateway.tar.gz control-plane.tar.gz root@${TEST_HOST}:/tmp/

      # 传输部署文件
      ssh ${SSH_OPTS} root@${TEST_HOST} "mkdir -p ${TEST_PATH}"
      scp ${SSH_OPTS} docker-compose.yml root@${TEST_HOST}:${TEST_PATH}/
      [ -f .env.example ] && scp ${SSH_OPTS} .env.example root@${TEST_HOST}:${TEST_PATH}/

      # 远程部署
      ssh ${SSH_OPTS} root@${TEST_HOST} << REMOTE_SCRIPT
        set -e
        cd ${TEST_PATH}

        # 加载镜像
        echo "Loading gateway image..."
        docker load < /tmp/gateway.tar.gz
        echo "Loading control-plane image..."
        docker load < /tmp/control-plane.tar.gz

        # 清理传输文件
        rm -f /tmp/gateway.tar.gz /tmp/control-plane.tar.gz

        # 如果 .env 不存在则从 example 复制
        [ ! -f .env ] && cp .env.example .env && echo "WARN: Created .env from .env.example"

        # 覆盖端口映射启动
        export IMAGE_TAG="${IMAGE_TAG}"
        export GATEWAY_PORT="${GATEWAY_PORT}"
        export CONTROL_PLANE_PORT="${CONTROL_PLANE_PORT}"
        export GATEWAY_HOST="0.0.0.0"
        export CP_HOST="0.0.0.0"
        docker compose up -d --remove-orphans --wait --wait-timeout 60

        echo "=== Deploy ${IMAGE_TAG} to test complete ==="
        docker compose ps
      REMOTE_SCRIPT
  environment:
    name: test
    url: http://${TEST_HOST}:${GATEWAY_PORT}
  dependencies:
    - build-gateway
    - build-control-plane
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
      when: on_success

# ─── Deploy Prod (192.0.2.10) ───────────────────────────────────────────
deploy:
  stage: deploy
  image: alpine:latest
  tags: [deploy]
  variables:
    SSH_DIR: "/tmp/ssh"
  before_script:
    - apk add --no-cache openssh-client curl
    - mkdir -p ${SSH_DIR} && chmod 700 ${SSH_DIR}
    - eval $(ssh-agent -a ${SSH_DIR}/agent.sock)
    - printf '%s\n' "$DEPLOY_SSH_KEY" > ${SSH_DIR}/deploy_key
    - chmod 600 ${SSH_DIR}/deploy_key
    - ssh-add ${SSH_DIR}/deploy_key
    - rm -f ${SSH_DIR}/deploy_key
    - >-
      ssh-keyscan -H ${DEPLOY_HOST} > ${SSH_DIR}/known_hosts 2>/dev/null
    - export GIT_SSH_COMMAND="ssh -o UserKnownHostsFile=${SSH_DIR}/known_hosts"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        export IMAGE_TAG="$CI_COMMIT_TAG"
      else
        export IMAGE_TAG="$CI_COMMIT_SHORT_SHA"
      fi
  script:
    - |
      SSH_OPTS="-o UserKnownHostsFile=${SSH_DIR}/known_hosts -o StrictHostKeyChecking=yes"
      echo "=== Deploying IMAGE_TAG=${IMAGE_TAG} to ${DEPLOY_HOST} ==="

      # 传输镜像文件
      scp ${SSH_OPTS} gateway.tar.gz control-plane.tar.gz root@${DEPLOY_HOST}:/tmp/

      # 传输部署文件
      ssh ${SSH_OPTS} root@${DEPLOY_HOST} "mkdir -p ${DEPLOY_PATH}"
      scp ${SSH_OPTS} docker-compose.yml root@${DEPLOY_HOST}:${DEPLOY_PATH}/
      scp ${SSH_OPTS} deploy/docker/nginx.conf root@${DEPLOY_HOST}:${DEPLOY_PATH}/
      [ -f .env.example ] && scp ${SSH_OPTS} .env.example root@${DEPLOY_HOST}:${DEPLOY_PATH}/

      # 远程部署
      ssh ${SSH_OPTS} root@${DEPLOY_HOST} << REMOTE_SCRIPT
        set -e
        cd ${DEPLOY_PATH}

        # 加载镜像
        echo "Loading gateway image..."
        docker load < /tmp/gateway.tar.gz
        echo "Loading control-plane image..."
        docker load < /tmp/control-plane.tar.gz

        # 清理传输文件
        rm -f /tmp/gateway.tar.gz /tmp/control-plane.tar.gz

        # 如果 .env 不存在则从 example 复制
        [ ! -f .env ] && cp .env.example .env && echo "WARN: Created .env from .env.example"

        # 滚动更新
        export IMAGE_TAG="${IMAGE_TAG}"
        docker compose up -d --remove-orphans --wait --wait-timeout 60

        echo "=== Deploy ${IMAGE_TAG} complete ==="
        docker compose ps
      REMOTE_SCRIPT
  environment:
    name: production
    url: http://${DEPLOY_HOST}
  dependencies:
    - build-gateway
    - build-control-plane
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success
    - if: $CI_COMMIT_BRANCH == "dev"
      when: manual
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual

# ─── Verify Stage ───────────────────────────────────────────────────────────
verify-test:
  stage: verify
  image: alpine:latest
  tags: [deploy]
  script:
    - apk add --no-cache curl
    - sleep 10
    - |
      echo "Checking gateway health on test..."
      curl -sf http://192.0.2.10:4010/health || {
        echo "ERROR: Gateway health check failed"
        exit 1
      }
      echo " ✓ Gateway healthy"
    - |
      echo "Checking control-plane health on test..."
      curl -sf http://192.0.2.10:4011/api/v1/provider-definitions || {
        echo "ERROR: Control-plane health check failed"
        exit 1
      }
      echo " ✓ Control-plane healthy"
  dependencies: []
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"

verify:
  stage: verify
  image: alpine:latest
  tags: [deploy]
  script:
    - apk add --no-cache curl
    - sleep 15
    - |
      echo "Checking gateway health..."
      curl -sf http://${DEPLOY_HOST}:80/health || curl -sf http://${DEPLOY_HOST}:8080/health || {
        echo "ERROR: Gateway health check failed"
        exit 1
      }
      echo " ✓ Gateway healthy"
    - |
      echo "Checking control-plane health..."
      curl -sf http://${DEPLOY_HOST}:80/api/v1/provider-definitions || curl -sf http://${DEPLOY_HOST}:8081/api/v1/provider-definitions || {
        echo "ERROR: Control-plane health check failed"
        exit 1
      }
      echo " ✓ Control-plane healthy"
  dependencies: []
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "dev"
      when: manual
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
