# llm_gateway GitLab CI/CD
# 构建 Go 项目 → 构建 Docker 镜像 → SSH 部署到目标服务器

variables:
  # Docker 镜像名（根据实际情况修改）
  IMAGE_NAME: "llm-gateway"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  # 部署目标服务器
  DEPLOY_HOST: "192.0.2.10"
  DEPLOY_USER: "root"
  DEPLOY_PATH: "/opt/llm-gateway"
  # 容器名和端口
  CONTAINER_NAME: "llm-gateway"
  APP_PORT: "8080"

stages:
  - test
  - build
  - deploy

# ==================== 测试阶段 ====================
test:
  stage: test
  image: golang:1.22
  tags:
    - deploy
  script:
    - go version
    - go mod download
    - go vet ./...
    - go test -race -coverprofile=coverage.out ./...
  coverage: '/coverage: \d+\.\d+%/'
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  allow_failure: true  # 项目初期没有测试，允许失败

# ==================== 构建阶段 ====================
build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  tags:
    - deploy
  before_script:
    - docker info
  script:
    - echo "Building image $IMAGE_NAME:$IMAGE_TAG"
    - docker build -t $IMAGE_NAME:$IMAGE_TAG -t $IMAGE_NAME:latest .
    - echo "Saving image to tar..."
    - docker save $IMAGE_NAME:latest | gzip > /tmp/llm-gateway.tar.gz
  artifacts:
    paths:
      - /tmp/llm-gateway.tar.gz
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ==================== 部署阶段 ====================
deploy:
  stage: deploy
  image: alpine:latest
  tags:
    - deploy
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$DEPLOY_SSH_KEY" | ssh-add -
    - mkdir -p ~/.ssh
    - echo "$DEPLOY_SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
  script:
    - echo "Deploying to $DEPLOY_HOST..."
    # 传输镜像文件
    - scp /tmp/llm-gateway.tar.gz $DEPLOY_USER@$DEPLOY_HOST:/tmp/
    # 远程执行部署
    - |
      ssh $DEPLOY_USER@$DEPLOY_HOST << 'REMOTE_SCRIPT'
        set -e
        mkdir -p $DEPLOY_PATH
        
        # 加载镜像
        docker load < /tmp/llm-gateway.tar.gz
        rm /tmp/llm-gateway.tar.gz
        
        # 停止旧容器
        docker stop $CONTAINER_NAME 2>/dev/null || true
        docker rm $CONTAINER_NAME 2>/dev/null || true
        
        # 启动新容器
        docker run -d \
          --name $CONTAINER_NAME \
          --restart unless-stopped \
          -p $APP_PORT:8080 \
          -e GIN_MODE=release \
          $IMAGE_NAME:latest
        
        # 等待健康检查
        sleep 5
        docker ps | grep $CONTAINER_NAME
        
        echo "Deploy complete!"
      REMOTE_SCRIPT
  variables:
    DEPLOY_PATH: "/opt/llm-gateway"
    CONTAINER_NAME: "llm-gateway"
    APP_PORT: "8080"
  environment:
    name: production
    url: http://192.0.2.10:8080
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual  # 手动触发部署，避免误操作
