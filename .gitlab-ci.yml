stages:
  - test
  - build
  - deploy
  - verify

variables:
  REGISTRY: "192.0.2.10:5000"
  REGISTRY_LOCAL: "127.0.0.1:5000"
  GATEWAY_IMAGE: "llm-gateway"
  CONTROL_PLANE_IMAGE: "llm-control-plane"
  TEST_HOST: "192.0.2.10"
  TEST_USER: "hgf"
  TEST_PATH: "/opt/llm-gateway"
  PROD_HOST: "192.0.2.10"
  PROD_PATH: "/opt/llm-gateway"

# ═══════════════════════════════════════════════════════════════════════════════
# Workflow Rules:
#   - dev 分支 tag (v*-rc*) → 测试流水线
#   - main 分支 tag (v*.*.*)  → 生产流水线
# ═══════════════════════════════════════════════════════════════════════════════
workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc/
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ─── Test Stage ─────────────────────────────────────────────────────────────
test:
  stage: test
  image: ${REGISTRY}/golang:1.26-alpine
  tags: [go]
  variables:
    GOPROXY: "https://goproxy.cn,direct"
    GONOSUMCHECK: "*"
  script:
    - go vet ./...
    - go test ./... -cover -count=1 -timeout 5m
  allow_failure: true
  rules:
    - if: $CI_COMMIT_TAG

# ─── Build Stage ────────────────────────────────────────────────────────────
.build_template: &build_template
  stage: build
  image: docker:24
  tags: [docker]
  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"
    DOCKER_BUILDKIT: "0"
  before_script:
    - export IMAGE_TAG="$CI_COMMIT_TAG"
  rules:
    - if: $CI_COMMIT_TAG

build-gateway-test:
  <<: *build_template
  script:
    - docker build --build-arg APP_ENV=staging -f deploy/docker/gateway.Dockerfile -t ${REGISTRY_LOCAL}/${GATEWAY_IMAGE}:${IMAGE_TAG} .
    - docker push ${REGISTRY_LOCAL}/${GATEWAY_IMAGE}:${IMAGE_TAG}
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc/

build-control-plane-test:
  <<: *build_template
  script:
    - docker build --build-arg APP_ENV=staging -f deploy/docker/control-plane.Dockerfile -t ${REGISTRY_LOCAL}/${CONTROL_PLANE_IMAGE}:${IMAGE_TAG} .
    - docker push ${REGISTRY_LOCAL}/${CONTROL_PLANE_IMAGE}:${IMAGE_TAG}
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc/

build-web-test:
  stage: build
  image: node:20-alpine
  tags: [docker]
  script:
    - cd web
    - npm ci
    - npm run build
    - tar -czf ../web-dist.tar.gz -C dist .
  artifacts:
    paths: [web-dist.tar.gz]
    expire_in: 2 hours
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc/

build-gateway-prod:
  <<: *build_template
  script:
    - docker build --build-arg APP_ENV=prod -f deploy/docker/gateway.Dockerfile -t ${REGISTRY_LOCAL}/${GATEWAY_IMAGE}:${IMAGE_TAG} .
    - docker push ${REGISTRY_LOCAL}/${GATEWAY_IMAGE}:${IMAGE_TAG}
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

build-control-plane-prod:
  <<: *build_template
  script:
    - docker build --build-arg APP_ENV=prod -f deploy/docker/control-plane.Dockerfile -t ${REGISTRY_LOCAL}/${CONTROL_PLANE_IMAGE}:${IMAGE_TAG} .
    - docker push ${REGISTRY_LOCAL}/${CONTROL_PLANE_IMAGE}:${IMAGE_TAG}
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

build-web-prod:
  stage: build
  image: node:20-alpine
  tags: [docker]
  script:
    - cd web
    - npm ci
    - npm run build
    - tar -czf ../web-dist.tar.gz -C dist .
  artifacts:
    paths: [web-dist.tar.gz]
    expire_in: 2 hours
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ─── Deploy Test (192.0.2.10) ─────────────────────────────────────────────
deploy-test:
  stage: deploy
  image: ${REGISTRY}/deploy-tools:latest
  tags: [deploy]
  variables:
    GATEWAY_PORT: "4010"
    CONTROL_PLANE_PORT: "4011"
  script:
    - |
      SSH_OPTS="-o StrictHostKeyChecking=no"
      IMAGE_TAG="$CI_COMMIT_TAG"
      echo "=== Deploying ${IMAGE_TAG} to ${TEST_HOST} (test) ==="

      ssh ${SSH_OPTS} ${TEST_USER}@${TEST_HOST} "mkdir -p ${TEST_PATH}"
      scp ${SSH_OPTS} docker-compose.yml ${TEST_USER}@${TEST_HOST}:${TEST_PATH}/

      ssh ${SSH_OPTS} ${TEST_USER}@${TEST_HOST} << REMOTE_SCRIPT
        set -e
        cd ${TEST_PATH}

        docker pull ${REGISTRY}/${GATEWAY_IMAGE}:${IMAGE_TAG}
        docker pull ${REGISTRY}/${CONTROL_PLANE_IMAGE}:${IMAGE_TAG}

        # 确保 .env 中数据库和 Redis 指向测试实例
        sed -i 's/dbname=llm_gateway /dbname=llm_gateway_test /' .env 2>/dev/null || true
        sed -i 's/^REDIS_DB=.*/REDIS_DB=1/' .env 2>/dev/null || true
        sed -i 's/^DB_NAME=.*/DB_NAME=llm_gateway_test/' .env 2>/dev/null || true

        export IMAGE_TAG="${IMAGE_TAG}"
        export REGISTRY="${REGISTRY}"
        export APP_ENV="staging"
        export GATEWAY_PORT="${GATEWAY_PORT}"
        export CONTROL_PLANE_PORT="${CONTROL_PLANE_PORT}"
        export GATEWAY_HOST="0.0.0.0"
        export CP_HOST="0.0.0.0"
        docker compose up -d --remove-orphans --wait --wait-timeout 60

        echo "=== Deploy ${IMAGE_TAG} to test complete ==="
        docker compose ps
      REMOTE_SCRIPT
  environment:
    name: test
    url: http://192.0.2.10:4010
  dependencies: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc/
      when: on_success

deploy-web-test:
  stage: deploy
  image: ${REGISTRY}/deploy-tools:latest
  tags: [deploy]
  variables:
    WEB_DIR: "/data/web/aimeter/dist"
  script:
    - |
      SSH_OPTS="-o StrictHostKeyChecking=no"
      echo "=== Deploying frontend to ${PROD_HOST}:${WEB_DIR} ==="
      scp ${SSH_OPTS} web-dist.tar.gz root@${PROD_HOST}:/tmp/
      ssh ${SSH_OPTS} root@${PROD_HOST} "mkdir -p ${WEB_DIR} && tar -xzf /tmp/web-dist.tar.gz -C ${WEB_DIR} && rm -f /tmp/web-dist.tar.gz"
      echo "=== Frontend deployed to prod ==="
  dependencies:
    - build-web-test
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc/
      when: on_success

# ─── Deploy Prod (192.0.2.10) ─────────────────────────────────────────────
deploy-prod:
  stage: deploy
  image: ${REGISTRY}/deploy-tools:latest
  tags: [deploy]
  variables:
    GATEWAY_PORT: "8080"
    CONTROL_PLANE_PORT: "8081"
  script:
    - |
      SSH_OPTS="-o StrictHostKeyChecking=no"
      IMAGE_TAG="$CI_COMMIT_TAG"
      echo "=== Deploying ${IMAGE_TAG} to ${PROD_HOST} (prod) ==="

      ssh ${SSH_OPTS} root@${PROD_HOST} "mkdir -p ${PROD_PATH}"
      scp ${SSH_OPTS} docker-compose.yml root@${PROD_HOST}:${PROD_PATH}/

      ssh ${SSH_OPTS} root@${PROD_HOST} << REMOTE_SCRIPT
        set -e
        cd ${PROD_PATH}

        docker pull ${REGISTRY}/${GATEWAY_IMAGE}:${IMAGE_TAG}
        docker pull ${REGISTRY}/${CONTROL_PLANE_IMAGE}:${IMAGE_TAG}

        export IMAGE_TAG="${IMAGE_TAG}"
        export REGISTRY="${REGISTRY}"
        export APP_ENV="prod"
        export GATEWAY_PORT="${GATEWAY_PORT}"
        export CONTROL_PLANE_PORT="${CONTROL_PLANE_PORT}"
        export GATEWAY_HOST="0.0.0.0"
        export CP_HOST="0.0.0.0"
        docker compose up -d --remove-orphans --wait --wait-timeout 60

        echo "=== Deploy ${IMAGE_TAG} to prod complete ==="
        docker compose ps
      REMOTE_SCRIPT
  environment:
    name: production
    url: http://192.0.2.10
  dependencies: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: manual

deploy-web-prod:
  stage: deploy
  image: ${REGISTRY}/deploy-tools:latest
  tags: [deploy]
  variables:
    WEB_DIR: "/data/web/aimeter/dist"
  script:
    - |
      SSH_OPTS="-o StrictHostKeyChecking=no"
      echo "=== Deploying frontend to ${PROD_HOST}:${WEB_DIR} ==="
      scp ${SSH_OPTS} web-dist.tar.gz root@${PROD_HOST}:/tmp/
      ssh ${SSH_OPTS} root@${PROD_HOST} "mkdir -p ${WEB_DIR} && tar -xzf /tmp/web-dist.tar.gz -C ${WEB_DIR} && rm -f /tmp/web-dist.tar.gz"
      echo "=== Frontend deployed to prod ==="
  dependencies:
    - build-web-prod
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: manual

# ─── Verify Stage ───────────────────────────────────────────────────────────
verify-test:
  stage: verify
  image: ${REGISTRY}/deploy-tools:latest
  tags: [deploy]
  script:
    - sleep 10
    - |
      echo "Checking gateway health on test..."
      curl -sf http://192.0.2.10:4010/health || { echo "ERROR: Gateway health check failed"; exit 1; }
      echo "Gateway healthy"
    - |
      echo "Checking control-plane health on test..."
      curl -sf http://192.0.2.10:4011/healthz || { echo "ERROR: Control-plane health check failed"; exit 1; }
      echo "Control-plane healthy"
  dependencies: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc/
