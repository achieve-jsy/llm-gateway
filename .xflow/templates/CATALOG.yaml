xuanwu-activity:
  description: "玄武平台游戏活动（AwardLua 服务端 + FGUI 客户端 + 配置/Redis/埋点/强弹/红点/支付 全套）"
  validations:
    # 玄武活动的所有内容文档（spec* / hld* / design* / task）均由 SKILL 依据
    # xwRef/xuanwu/xuanwu-activity/*/bundle.yaml 指向的玄武模板生成，章节结构由玄武团队维护；
    # SKILL 自身在 Step 6 已跑 reviewer Agent 按 bundle.validation.checklists 做过语义校验，
    # xf-validate 再用 .xflow/templates/xuanwu-activity/*.md 骨架做字符串级 required-sections
    # 对比必然错位，因此在此类型下关掉该规则。保留的机械校验：
    #   file-exists / no-placeholder / no-empty-section / delta-baseline
    skip_required_sections: true
  files:
    # ── clarify 阶段：需求总纲 + 11 个业务切面子文档 ──
    spec.md:
      status: required
      phase: clarify
    spec_overview.md:
      status: required
      phase: clarify
    spec_mechanic.md:
      status: required
      phase: clarify
    spec_eligibility.md:
      status: required
      phase: clarify
    spec_protocol.md:
      status: required
      phase: clarify
    spec_state-data.md:
      status: required
      phase: clarify
    spec_config.md:
      status: required
      phase: clarify
    spec_reward.md:
      status: required
      phase: clarify
    spec_ui-interaction.md:
      status: required
      phase: clarify
    spec_red-dot.md:
      status: required
      phase: clarify
    spec_force-popup.md:
      status: required
      phase: clarify
    spec_analytics.md:
      status: required
      phase: clarify
    spec_payment.md:
      status: optional
      phase: clarify

    # ── design 阶段：概要设计总纲 + 双端架构 ──
    hld.md:
      status: required
      phase: design
    hld_client.md:
      status: required
      phase: design
    hld_server.md:
      status: required
      phase: design

    # ── design 阶段 dynamic：arch-designer SKILL 按需产出（不铺骨架） ──
    # 来源：.xflow/profiles/xuanwu-activity/design.md（hld_client_<id> / hld_server_<id> 系列）
    # 实际产出由 .xflow/templates/xuanwu-activity/tech/bundle.yaml 决定，下表为已知子类
    hld_client_core.md:
      status: dynamic
      phase: design
    hld_client_entry-popup.md:
      status: dynamic
      phase: design
    hld_client_ui-analytics.md:
      status: dynamic
      phase: design
    hld_client_freeze.md:
      status: dynamic
      phase: design
    hld_client_fgui.md:
      status: dynamic
      phase: design
    hld_client_payment.md:
      status: dynamic
      phase: design
    hld_server_protocol.md:
      status: dynamic
      phase: design
    hld_server_config.md:
      status: dynamic
      phase: design
    hld_server_freeze.md:
      status: dynamic
      phase: design
    hld_server_redis.md:
      status: dynamic
      phase: design
    技术架构报告.md:
      status: dynamic
      phase: design

    # ── detail 阶段：实现冻结总纲 + 双端冻结文档 ──
    design.md:
      status: required
      phase: detail
    design_client.md:
      status: required
      phase: detail
    design_server.md:
      status: required
      phase: detail

    # ── detail 阶段 dynamic：design-detailer SKILL 按需产出（不铺骨架） ──
    # 来源：.xflow/profiles/xuanwu-activity/detail.md
    # 实际产出由 .xflow/templates/xuanwu-activity/tech-design/bundle.yaml 决定
    design_client_freeze.md:
      status: dynamic
      phase: detail
    design_server_freeze.md:
      status: dynamic
      phase: detail
    design_client_tasks.md:
      status: dynamic
      phase: detail
    design_server_tasks.md:
      status: dynamic
      phase: detail
    design_client_self_check.md:
      status: dynamic
      phase: detail
    design_server_self_check.md:
      status: dynamic
      phase: detail
    design-report.md:
      status: dynamic
      phase: detail

    # ── task 阶段 ──
    task.md:
      status: required
      phase: task

