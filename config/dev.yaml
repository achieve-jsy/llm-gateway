# 开发环境配置
server:
  port: "8080"

controlplane:
  port: "8081"

redis:
  addr: "192.0.2.10:6379"
  password: "CHANGE_ME_REDIS_PASSWORD"
  db: 0

database:
  url: "host=192.0.2.10 port=5432 user=llm_gateway password=CHANGE_ME_PASSWORD dbname=llm_gateway sslmode=disable"

otlp:
  endpoint: "127.0.0.1:4317"
  enabled: false

provider:
  internal_token: "CHANGE_ME_INTERNAL_TOKEN"
  control_plane_url: "http://127.0.0.1:8081"

auth:
  url: "http://127.0.0.1:8081"
  token: "CHANGE_ME_INTERNAL_TOKEN"

oauth:
  issuer_url: "https://oauth.example.net/"
  client_id: "5514f6bb0a"
  client_secret: "CHANGE_ME_OAUTH_SECRET"
  redirect_uri: "https://aimeter.xk-devops.com/auth/callback"
  scopes: "openid profile email"

jwt:
  secret: "CHANGE_ME_JWT_SECRET"

frontend:
  url: "http://127.0.0.1:5173"

gateway:
  url: "http://127.0.0.1:8080"

# 模型等级额度在开发环境也保持与生产一致的记账和拦截语义，避免页面显示额度但请求未被限制。
budget_tier:
  master_enabled: true
  accounting_enabled: true
  positive_enforcement_enabled: true
  zero_block_enabled: true
  shadow_enabled: false
  v2_total_enforcement_enabled: false
  legacy_total_write_enabled: true

# 调用链路正文归档 v3（契约：docs/trace-archive-v3-implementation-contract.md §2.2）
# 开发环境默认关闭写入与点读；需要本地验证时用 ARCHIVE_WRITE_ENABLED / ARCHIVE_READ_ENABLED 覆盖。
archive:
  write:
    enabled: false
  read:
    enabled: false
  root: /datalog/llm-gateway-archive
  tz: Asia/Shanghai
  hot_window_days: 3
  days_per_night: 2
  closure_lag_hours: 24
  cron_schedule: "0 3 * * *"
  chunk_mb: 256
  zstd_level: best
  zstd_window_mb: 128
  encoder_concurrency: 1
  max_concurrent_reads: 4
  batch_rows: 1000
  max_retry: 5
  verify_sample_rows: 20
  inspect_freshness_hours: 168
  inspect_per_cycle: 3
  backfill:
    enabled: false
    max_days: 30
  require_offhost_copy: true
  offhost_copy_marker: ""
  offhost_marker_freshness_hours: 24
  disk_watermark_percent: 80
  max_disk_gb: 0
  retention_days: 180
  staging_retention_hours: 336
