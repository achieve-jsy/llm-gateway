# 生产环境配置 (APP_ENV=prod)
# 敏感值通过环境变量注入，此文件仅定义结构和非敏感默认值
server:
  port: "8080"

controlplane:
  port: "8081"

redis:
  addr: "${REDIS_ADDR}"
  password: "${REDIS_PASSWORD}"
  db: 0

database:
  url: "${DATABASE_URL}"

otlp:
  endpoint: "${OTLP_ENDPOINT}"
  enabled: true

provider:
  internal_token: "${INTERNAL_TOKEN}"
  control_plane_url: "http://llm-gw-control-plane:8081"

auth:
  url: "http://llm-gw-control-plane:8081"
  token: "${INTERNAL_TOKEN}"

oauth:
  issuer_url: "${OAUTH_ISSUER_URL}"
  client_id: "${OAUTH_CLIENT_ID}"
  client_secret: "${OAUTH_CLIENT_SECRET}"
  redirect_uri: "${OAUTH_REDIRECT_URI}"
  scopes: "openid profile email"

jwt:
  secret: "${JWT_SECRET}"

frontend:
  url: "${FRONTEND_URL}"
