# 调用链路正文归档 v3（契约：docs/trace-archive-v3-implementation-contract.md §2.2）
# 开关拆分：write=归档 cron/janitor，read=点读；回滚时只关写、点读继续可用。
# 所有项均可被 ARCHIVE_* 环境变量覆盖（blue-green compose 已透传）。
archive:
  write:
    enabled: false
  read:
    enabled: false
  root: /datalog/llm-gateway-archive
  tz: Asia/Shanghai
  hot_window_days: 3
  days_per_night: 2
  closure_lag_hours: 24
  cron_schedule: "0 3 * * *"
  chunk_mb: 256
  zstd_level: best
  zstd_window_mb: 128
  encoder_concurrency: 1
  max_concurrent_reads: 4
  batch_rows: 1000
  max_retry: 5
  verify_sample_rows: 20
  inspect_freshness_hours: 168
  inspect_per_cycle: 3
  backfill:
    enabled: false
    max_days: 30
  require_offhost_copy: true
  offhost_copy_marker: ""
  offhost_marker_freshness_hours: 24
  disk_watermark_percent: 80
  max_disk_gb: 0
  retention_days: 180
  staging_retention_hours: 336
