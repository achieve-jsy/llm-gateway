# 测试环境配置 (APP_ENV=staging)
# 部署目标: 192.0.2.10
server:
  port: "8080"

controlplane:
  port: "8081"

redis:
  addr: "192.0.2.10:6379"
  password: "CHANGE_ME_REDIS_PASSWORD"
  db: 1

database:
  url: "host=192.0.2.10 port=5432 user=llm_gateway password=CHANGE_ME_PASSWORD dbname=llm_gateway_test sslmode=disable"

otlp:
  endpoint: "localhost:4317"
  enabled: false

provider:
  internal_token: "CHANGE_ME_INTERNAL_TOKEN"
  control_plane_url: "http://llm-gw-control-plane:8081"

auth:
