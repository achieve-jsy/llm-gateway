# 测试环境配置 (APP_ENV=staging)
# 部署目标: 192.0.2.10
# 敏感值（密码/密钥/secret）全部由环境变量注入，不在此文件出现
server:
  port: "8080"

controlplane:
  port: "8081"

redis:
  addr: "192.0.2.10:6379"
  db: 1

otlp:
  endpoint: "localhost:4317"
  enabled: false

provider:
  control_plane_url: "http://llm-gw-control-plane:8081"

auth:
  url: "http://llm-gw-control-plane:8081"

oauth:
  issuer_url: "https://oauth.example.net/"
  client_id: "5514f6bb0a"
  redirect_uri: "http://192.0.2.10:9080/auth/callback"
  scopes: "openid profile email"

frontend:
  url: "http://192.0.2.10:9080"

gateway:
  url: "http://192.0.2.10:9080"
