# Staging 环境配置
server:
  port: "8080"

controlplane:
  port: "8081"

redis:
  addr: "redis:6379"
  password: ""
  db: 0

database:
  url: "host=postgres port=5432 user=llm_gateway password=llm_gateway_staging dbname=llm_gateway sslmode=disable"

otlp:
  endpoint: "otel-collector:4317"
  enabled: true

provider:
  internal_token: "${INTERNAL_TOKEN}"
  control_plane_url: "http://control-plane:8081"

oauth:
  issuer_url: "https://oauth.example.net"
  client_id: "${OAUTH_CLIENT_ID}"
  client_secret: "${OAUTH_CLIENT_SECRET}"
  redirect_uri: "${OAUTH_REDIRECT_URI}"
  scopes: "openid profile email"

jwt:
  secret: "${JWT_SECRET}"

frontend:
  url: "${FRONTEND_URL}"
