# 测试环境配置 (APP_ENV=test)
# 部署目标: 192.0.2.10
#
# 密钥/连接串不再明文写在此文件，统一由 GitLab CI/CD 变量（TEST_* 系列）经
# docker-compose 环境变量注入；Viper 的环境变量绑定会覆盖以下留空项。
# 规范见 skill: test-env-config。涉及：redis.password / database.url /
# provider.internal_token / auth.token / oauth.client_id / oauth.client_secret / jwt.secret
server:
  port: "8080"

controlplane:
  port: "8081"

redis:
  addr: "127.0.0.1:6379"
  password: ""
  db: 0

database:
  url: ""

otlp:
  endpoint: "localhost:4317"
  enabled: false

provider:
  internal_token: ""
  control_plane_url: "http://127.0.0.1:8081"

auth:
  url: "http://127.0.0.1:8081"
  token: ""

oauth:
  issuer_url: "https://oauth.example.net/"
  client_id: ""
  client_secret: ""
  redirect_uri: "http://192.0.2.10:9080/auth/callback"
  scopes: "openid profile email"

jwt:
  secret: ""

frontend:
  url: "http://192.0.2.10:9080"

gateway:
  url: "http://192.0.2.10:9080"

# 调用链路正文归档 v3（契约：docs/trace-archive-v3-implementation-contract.md §2.2）
# 全部为环境耦合的非密钥值，可直接写在此处；默认关闭写入与点读，需要时由 ARCHIVE_* 覆盖。
archive:
  write:
    enabled: false
  read:
    enabled: false
  root: /datalog/llm-gateway-archive
  tz: Asia/Shanghai
  hot_window_days: 3
  days_per_night: 2
  closure_lag_hours: 24
  cron_schedule: "0 3 * * *"
  chunk_mb: 256
  zstd_level: best
  zstd_window_mb: 128
  encoder_concurrency: 1
  max_concurrent_reads: 4
  batch_rows: 1000
  max_retry: 5
  verify_sample_rows: 20
  inspect_freshness_hours: 168
  inspect_per_cycle: 3
  backfill:
    enabled: false
    max_days: 30
  require_offhost_copy: true
  offhost_copy_marker: ""
  offhost_marker_freshness_hours: 24
  disk_watermark_percent: 80
  max_disk_gb: 0
  retention_days: 180
  staging_retention_hours: 336
