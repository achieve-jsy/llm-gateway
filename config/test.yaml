# 测试环境配置 (APP_ENV=test)
# 部署目标: 192.0.2.10
#
# 密钥/连接串不再明文写在此文件，统一由 GitLab CI/CD 变量（TEST_* 系列）经
# docker-compose 环境变量注入；Viper 的环境变量绑定会覆盖以下留空项。
# 规范见 skill: test-env-config。涉及：redis.password / database.url /
# provider.internal_token / auth.token / oauth.client_id / oauth.client_secret / jwt.secret
server:
  port: "8080"

controlplane:
  port: "8081"

redis:
  addr: "127.0.0.1:6379"
  password: ""
  db: 0

database:
  url: ""

otlp:
  endpoint: "localhost:4317"
  enabled: false

provider:
  internal_token: ""
  control_plane_url: "http://127.0.0.1:8081"

auth:
  url: "http://127.0.0.1:8081"
  token: ""

oauth:
  issuer_url: "https://oauth.example.net/"
  client_id: ""
  client_secret: ""
  redirect_uri: "http://192.0.2.10:9080/auth/callback"
  scopes: "openid profile email"

jwt:
  secret: ""

frontend:
  url: "http://192.0.2.10:9080"

gateway:
  url: "http://192.0.2.10:9080"

# 协议转换策略（relaykit 集成）
#
# 测试环境默认启用原生旁路，用于验证「原始 body 零转换直发上游」这条链路。
# 三档语义：legacy = 关原生走转换；shadow = 影子对比但返回转换结果；
# active = 开原生，仅当渠道声明 ErrNativeNotSupported 时降级。
#
# 回退：把 default_mode 改回 legacy 重新发布即可；无需回滚镜像。
protocol:
  default_mode: active
