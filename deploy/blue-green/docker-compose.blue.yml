# ═══════════════════════════════════════════════════════════════════════════════
# 蓝绿部署 — BLUE 环境
# 端口：gateway:8080  control-plane:8081
#
# 使用方式：
#   docker compose -f docker-compose.blue.yml -p llm-blue up -d
# ═══════════════════════════════════════════════════════════════════════════════

services:
  gateway:
    image: ${REGISTRY:-192.0.2.10:5000}/llm-gateway:${IMAGE_TAG:-latest}
    container_name: llm-blue-gateway
    restart: unless-stopped
    network_mode: host
    environment:
      APP_ENV: ${APP_ENV:-prod}
      GATEWAY_PORT: "8080"
      REDIS_ADDR: ${REDIS_ADDR:-192.0.2.10:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
      REDIS_DB: ${REDIS_DB:-3}
      INTERNAL_TOKEN: ${INTERNAL_AUTH_TOKEN:?INTERNAL_AUTH_TOKEN required}
      AUTH_INTERNAL_TOKEN: ${INTERNAL_AUTH_TOKEN}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      CONTROL_PLANE_URL: http://127.0.0.1:8081
      AUTH_URL: http://127.0.0.1:8081
      BUDGET_TIER_MASTER_ENABLED: ${BUDGET_TIER_MASTER_ENABLED:-false}
      BUDGET_TIER_ACCOUNTING_ENABLED: ${BUDGET_TIER_ACCOUNTING_ENABLED:-false}
      BUDGET_TIER_POSITIVE_ENFORCEMENT_ENABLED: ${BUDGET_TIER_POSITIVE_ENFORCEMENT_ENABLED:-false}
      BUDGET_TIER_ZERO_BLOCK_ENABLED: ${BUDGET_TIER_ZERO_BLOCK_ENABLED:-false}
      BUDGET_TIER_SHADOW_ENABLED: ${BUDGET_TIER_SHADOW_ENABLED:-false}
      BUDGET_V2_TOTAL_ENFORCEMENT_ENABLED: ${BUDGET_V2_TOTAL_ENFORCEMENT_ENABLED:-false}
      BUDGET_LEGACY_TOTAL_WRITE_ENABLED: ${BUDGET_LEGACY_TOTAL_WRITE_ENABLED:-true}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 600s
    deploy:
      resources:
        limits:
          memory: 2g

  control-plane:
    image: ${REGISTRY:-192.0.2.10:5000}/llm-control-plane:${IMAGE_TAG:-latest}
    container_name: llm-blue-control-plane
    restart: unless-stopped
    network_mode: host
    environment:
      APP_ENV: ${APP_ENV:-prod}
      CONTROL_PLANE_PORT: "8081"
      GATEWAY_URL: "http://127.0.0.1:8080"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      REDIS_ADDR: ${REDIS_ADDR:-192.0.2.10:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
      REDIS_DB: ${REDIS_DB:-3}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN:?INTERNAL_AUTH_TOKEN required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY required}
      OAUTH_ISSUER_URL: ${OAUTH_ISSUER_URL:-https://oauth.example.net/}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:?OAUTH_CLIENT_ID required}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:?OAUTH_CLIENT_SECRET required}
      OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI:-https://aimeter.xk-devops.com/auth/callback}
      OAUTH_SCOPES: ${OAUTH_SCOPES:-openid profile email}
      FRONTEND_URL: ${FRONTEND_URL:-https://aimeter.xk-devops.com}
      DEV_LOGIN_ENABLED: ${DEV_LOGIN_ENABLED:-false}
      DEV_LOGIN_PROD_ALLOWED: ${DEV_LOGIN_PROD_ALLOWED:-false}
      BUDGET_TIER_MASTER_ENABLED: ${BUDGET_TIER_MASTER_ENABLED:-false}
      BUDGET_TIER_ACCOUNTING_ENABLED: ${BUDGET_TIER_ACCOUNTING_ENABLED:-false}
      BUDGET_TIER_POSITIVE_ENFORCEMENT_ENABLED: ${BUDGET_TIER_POSITIVE_ENFORCEMENT_ENABLED:-false}
      BUDGET_TIER_ZERO_BLOCK_ENABLED: ${BUDGET_TIER_ZERO_BLOCK_ENABLED:-false}
      BUDGET_TIER_SHADOW_ENABLED: ${BUDGET_TIER_SHADOW_ENABLED:-false}
      BUDGET_V2_TOTAL_ENFORCEMENT_ENABLED: ${BUDGET_V2_TOTAL_ENFORCEMENT_ENABLED:-false}
      BUDGET_LEGACY_TOTAL_WRITE_ENABLED: ${BUDGET_LEGACY_TOTAL_WRITE_ENABLED:-true}
      # ─── trace 正文归档 v3（契约 §2.1：write/read 两个独立开关）────────────────
      ARCHIVE_WRITE_ENABLED: ${ARCHIVE_WRITE_ENABLED:-false}
      ARCHIVE_READ_ENABLED: ${ARCHIVE_READ_ENABLED:-false}
      ARCHIVE_ROOT: ${ARCHIVE_ROOT:-/datalog/llm-gateway-archive}
      ARCHIVE_TZ: ${ARCHIVE_TZ:-Asia/Shanghai}
      ARCHIVE_HOT_WINDOW_DAYS: ${ARCHIVE_HOT_WINDOW_DAYS:-3}
      ARCHIVE_DAYS_PER_NIGHT: ${ARCHIVE_DAYS_PER_NIGHT:-2}
      ARCHIVE_CLOSURE_LAG_HOURS: ${ARCHIVE_CLOSURE_LAG_HOURS:-24}
      ARCHIVE_CRON_SCHEDULE: "${ARCHIVE_CRON_SCHEDULE:-0 3 * * *}"
      ARCHIVE_CHUNK_MB: ${ARCHIVE_CHUNK_MB:-256}
      ARCHIVE_ZSTD_LEVEL: ${ARCHIVE_ZSTD_LEVEL:-best}
      ARCHIVE_ZSTD_WINDOW_MB: ${ARCHIVE_ZSTD_WINDOW_MB:-128}
      ARCHIVE_ENCODER_CONCURRENCY: ${ARCHIVE_ENCODER_CONCURRENCY:-1}
      ARCHIVE_MAX_CONCURRENT_READS: ${ARCHIVE_MAX_CONCURRENT_READS:-4}
      ARCHIVE_BATCH_ROWS: ${ARCHIVE_BATCH_ROWS:-1000}
      ARCHIVE_MAX_RETRY: ${ARCHIVE_MAX_RETRY:-5}
      ARCHIVE_VERIFY_SAMPLE_ROWS: ${ARCHIVE_VERIFY_SAMPLE_ROWS:-20}
      ARCHIVE_INSPECT_FRESHNESS_HOURS: ${ARCHIVE_INSPECT_FRESHNESS_HOURS:-168}
      ARCHIVE_INSPECT_PER_CYCLE: ${ARCHIVE_INSPECT_PER_CYCLE:-3}
      ARCHIVE_BACKFILL_ENABLED: ${ARCHIVE_BACKFILL_ENABLED:-false}
      ARCHIVE_BACKFILL_MAX_DAYS: ${ARCHIVE_BACKFILL_MAX_DAYS:-30}
      ARCHIVE_REQUIRE_OFFHOST_COPY: ${ARCHIVE_REQUIRE_OFFHOST_COPY:-true}
      ARCHIVE_OFFHOST_COPY_MARKER: ${ARCHIVE_OFFHOST_COPY_MARKER:-}
      ARCHIVE_OFFHOST_MARKER_FRESHNESS_HOURS: ${ARCHIVE_OFFHOST_MARKER_FRESHNESS_HOURS:-24}
      # 历史键名（语义为磁盘使用率百分比，契约 §2.1）
      ARCHIVE_DISK_WATERMARK_MB: ${ARCHIVE_DISK_WATERMARK_MB:-80}
      ARCHIVE_MAX_DISK_GB: ${ARCHIVE_MAX_DISK_GB:-0}
      ARCHIVE_RETENTION_DAYS: ${ARCHIVE_RETENTION_DAYS:-180}
      ARCHIVE_STAGING_RETENTION_HOURS: ${ARCHIVE_STAGING_RETENTION_HOURS:-336}
    volumes:
      # 归档数据目录（宿主机 /datalog，与 config 的 archive.root 对应）
      - /datalog:/datalog
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 600s
    deploy:
      resources:
        limits:
          memory: 2g
