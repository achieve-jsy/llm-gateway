# ═══════════════════════════════════════════════════════════════════════════════
# 蓝绿部署 — GREEN 环境
# 端口：gateway:8082  control-plane:8083
#
# 使用方式：
#   docker compose -f docker-compose.green.yml -p llm-green up -d
# ═══════════════════════════════════════════════════════════════════════════════

services:
  gateway:
    image: ${REGISTRY:-192.0.2.10:5000}/llm-gateway:${IMAGE_TAG:-latest}
    container_name: llm-green-gateway
    restart: unless-stopped
    network_mode: host
    environment:
      APP_ENV: ${APP_ENV:-prod}
      GATEWAY_PORT: "8082"
      REDIS_ADDR: ${REDIS_ADDR:-192.0.2.10:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
      REDIS_DB: ${REDIS_DB:-3}
      INTERNAL_TOKEN: ${INTERNAL_AUTH_TOKEN:?INTERNAL_AUTH_TOKEN required}
      AUTH_INTERNAL_TOKEN: ${INTERNAL_AUTH_TOKEN}
      # 可逆脱敏（docs/redaction.md）：off 不启用 / detect 只观测 / mask 改写并还原。
      # mask 还要 PRIVACY_KEY_PATH 指向多副本共享的密钥文件，否则占位符逐请求变化、前缀缓存全失效。
      PRIVACY_MODE: ${PRIVACY_MODE:-off}
      # 仅 mask 模式需要：指到一份多副本共享的密钥文件，否则占位符逐请求变化、上游前缀缓存全失效。
      PRIVACY_KEY_PATH: ${PRIVACY_KEY_PATH:-}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      CONTROL_PLANE_URL: http://127.0.0.1:8083
      AUTH_URL: http://127.0.0.1:8083
      BUDGET_TIER_MASTER_ENABLED: ${BUDGET_TIER_MASTER_ENABLED:-false}
      BUDGET_TIER_ACCOUNTING_ENABLED: ${BUDGET_TIER_ACCOUNTING_ENABLED:-false}
      BUDGET_TIER_POSITIVE_ENFORCEMENT_ENABLED: ${BUDGET_TIER_POSITIVE_ENFORCEMENT_ENABLED:-false}
      BUDGET_TIER_ZERO_BLOCK_ENABLED: ${BUDGET_TIER_ZERO_BLOCK_ENABLED:-false}
      BUDGET_TIER_SHADOW_ENABLED: ${BUDGET_TIER_SHADOW_ENABLED:-false}
      BUDGET_V2_TOTAL_ENFORCEMENT_ENABLED: ${BUDGET_V2_TOTAL_ENFORCEMENT_ENABLED:-false}
      BUDGET_LEGACY_TOTAL_WRITE_ENABLED: ${BUDGET_LEGACY_TOTAL_WRITE_ENABLED:-true}
      # ── 调用链正文直写（方案 C，计划 2/4）──
      # inst 必须与颜色一一对应，且**不能**放进 config/prod.yaml：全局 YAML 会让
      # 两个颜色写进同一个 inst= 目录（part 序号与 spool 会互相踩）。
      TRACE_BODY_INST: green
      TRACE_BODY_BLOCK_MB: "1536"
      TRACE_BODY_FLUSH_INTERVAL: 1m
      TRACE_BODY_ROLL_INTERVAL: 1h
      TRACE_BODY_DISK_WATERMARK_PERCENT: "90"
      # 功能开关：取消注释即开启（前置条件见任务 7 的硬门：读侧就绪 + 挂载在场）。
      TRACE_BODY_ROOT: /datalog/trace-archive-v4
    volumes:
      # 长语法（不是 `-v`）：source/target 显式，且**绝不**让 Docker 去创建宿主路径。
      # 部署前必须先 `findmnt -T /datalog` 证明挂载在场（见任务 6 步骤 5）。
      - type: bind
        source: /datalog
        target: /datalog
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 600s
    deploy:
      resources:
        limits:
          memory: 2g

  control-plane:
    image: ${REGISTRY:-192.0.2.10:5000}/llm-control-plane:${IMAGE_TAG:-latest}
    container_name: llm-green-control-plane
    restart: unless-stopped
    network_mode: host
    environment:
      APP_ENV: ${APP_ENV:-prod}
      CONTROL_PLANE_PORT: "8083"
      # 本机观测端点（pprof/metrics）监听地址。蓝绿两色都以 host 网络**同时**运行，
      # 必须错开端口：否则后启动的一色绑定失败，且观测端点可能停在“备用色”上，
      # 排查事故时抓到的会是错误的进程。
      CONTROL_PLANE_ADMIN_ADDR: 127.0.0.1:9092
      GATEWAY_URL: "http://127.0.0.1:8082"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      REDIS_ADDR: ${REDIS_ADDR:-192.0.2.10:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
      REDIS_DB: ${REDIS_DB:-3}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN:?INTERNAL_AUTH_TOKEN required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY required}
      OAUTH_ISSUER_URL: ${OAUTH_ISSUER_URL:-https://oauth.example.net/}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:?OAUTH_CLIENT_ID required}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:?OAUTH_CLIENT_SECRET required}
      OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI:-https://aimeter.xk-devops.com/auth/callback}
      OAUTH_SCOPES: ${OAUTH_SCOPES:-openid profile email}
      FRONTEND_URL: ${FRONTEND_URL:-https://aimeter.xk-devops.com}
      # EHR 接口中心（AI 应用聚合页同步）。三者齐全才启动每日同步；空值 = 功能关闭。
      # 值由 GitLab 变量 TEST_*/PROD_*_EHR_* 导出，仓库里不留明文。
      EHR_BASE_URL: ${EHR_BASE_URL:-}
      EHR_API_TOKEN: ${EHR_API_TOKEN:-}
      EHR_ORG_ID: ${EHR_ORG_ID:-}
      EHR_PREFIX: ${EHR_PREFIX:-/open-apis/ehr-apic/open-apis/resource/v1}
      AI_APP_HUB_SYNC_CRON: "${AI_APP_HUB_SYNC_CRON:-0 2 * * *}"
      AI_APP_HUB_SYNC_TZ: ${AI_APP_HUB_SYNC_TZ:-Asia/Shanghai}
      # 本镜像的构建/部署时间戳（秒）。蓝绿两色都跑定时同步，靠它让更新的构建先跑、
      # 旧构建让位，避免备用色用旧代码写掉当天已有数据。空值 = 不参与比较。
      APP_BUILD_TIME: ${APP_BUILD_TIME:-}
      DEV_LOGIN_ENABLED: ${DEV_LOGIN_ENABLED:-false}
      DEV_LOGIN_PROD_ALLOWED: ${DEV_LOGIN_PROD_ALLOWED:-false}
      BUDGET_TIER_MASTER_ENABLED: ${BUDGET_TIER_MASTER_ENABLED:-false}
      BUDGET_TIER_ACCOUNTING_ENABLED: ${BUDGET_TIER_ACCOUNTING_ENABLED:-false}
      BUDGET_TIER_POSITIVE_ENFORCEMENT_ENABLED: ${BUDGET_TIER_POSITIVE_ENFORCEMENT_ENABLED:-false}
      BUDGET_TIER_ZERO_BLOCK_ENABLED: ${BUDGET_TIER_ZERO_BLOCK_ENABLED:-false}
      BUDGET_TIER_SHADOW_ENABLED: ${BUDGET_TIER_SHADOW_ENABLED:-false}
      BUDGET_V2_TOTAL_ENFORCEMENT_ENABLED: ${BUDGET_V2_TOTAL_ENFORCEMENT_ENABLED:-false}
      BUDGET_LEGACY_TOTAL_WRITE_ENABLED: ${BUDGET_LEGACY_TOTAL_WRITE_ENABLED:-true}
      # ── 调用链正文点读（读侧，计划 3/4）──
      # root 必须与写侧(gateway 的 TRACE_BODY_ROOT)同一个值；为空 ⇒ 读侧禁用、接口返回 503。
      # 判据见 internal/controlplane/config/trace_body_read.go 的 Disabled()。
      TRACE_BODY_ROOT: /datalog/trace-archive-v4
      GOMEMLIMIT: ${GOMEMLIMIT:-3584MiB}
    volumes:
      # 控制面只点读（冻结包 reader 全程不写文件）⇒ 只读挂载即可。
      - type: bind
        source: /datalog
        target: /datalog
        read_only: true
    healthcheck:
      # /readyz 会 ping Postgres/Redis，避免「进程活着但读不了 api_keys」被判健康
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8083/readyz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 600s
    deploy:
      resources:
        limits:
          memory: 4g
