# llm_gateway 部署配置
# 部署到目标服务器: 192.0.2.10

services:
  gateway:
    image: llm-gateway:latest
    container_name: llm-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - GIN_MODE=release
      - TZ=Asia/Shanghai
    # 如果需要连接数据库，取消注释下面的配置：
    # env_file:
    #   - .env
    # 如果目标服务器有共享网络，取消注释：
    # networks:
    #   - llm-net
    mem_limit: 512m
    memswap_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# networks:
#   llm-net:
#     external: true
