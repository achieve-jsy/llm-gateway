# ═══════════════════════════════════════════════════════════════════════════════
# 开发环境 nginx 配置 — 通过 IP:端口 访问
#
# 部署方式：
#   ln -sf /home/hgf/code/llm_gateway/deploy/docker/nginx-dev.conf /www/server/nginx/conf/vhost/aimeter-dev.conf
#   sudo nginx -t && sudo nginx -s reload
#
# 访问地址：
#   前端页面   : http://192.0.2.10:8090
#   Gateway API: http://192.0.2.10:8090/v1/
#   CP API     : http://192.0.2.10:8090/api/
# ═══════════════════════════════════════════════════════════════════════════════

upstream aimeter_dev_gateway {
    server 127.0.0.1:8080;
}

upstream aimeter_dev_cp {
    server 127.0.0.1:8081;
}

server {
    listen 8090;
    listen [::]:8090;
    server_name _;

    root /home/hgf/code/llm_gateway/web/dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # ─── LLM Gateway API（OpenAI 兼容接口） ──────────────────────────────────────
    location /v1/ {
        proxy_pass http://aimeter_dev_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
        chunked_transfer_encoding on;
    }

    location /health {
        proxy_pass http://aimeter_dev_gateway;
    }

    location /ready {
        proxy_pass http://aimeter_dev_gateway;
    }

    location /swagger/ {
        proxy_pass http://aimeter_dev_gateway;
    }

    # ─── Control Plane 管理 API ──────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://aimeter_dev_cp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ─── OAuth 前端回调（SPA 路由，由 nginx 处理为 index.html） ─────────────────────
    location = /auth/callback {
        try_files /index.html =404;
    }

    # ─── OAuth 认证 API ───────────────────────────────────────────────────────────
    location /auth/ {
        proxy_pass http://aimeter_dev_cp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── 静态资源缓存 ────────────────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # ─── Vue SPA 回退 ────────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}