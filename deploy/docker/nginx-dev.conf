# ═══════════════════════════════════════════════════════════════════════════════
# 开发环境 nginx 配置 — 通过 IP:端口 访问
#
# 前端走 Vite 开发服务器（make dev-all 启动），支持热更新（HMR）；
# 后端 /v1 /api /auth 直接反代到 gateway / control-plane。
#
# 部署方式：
#   ln -sf /home/hgf/code/llm_gateway/deploy/docker/nginx-dev.conf /www/server/nginx/conf/vhost/aimeter-dev.conf
#   sudo nginx -t && sudo nginx -s reload
#
# 访问地址：
#   前端页面   : http://192.0.2.10:8090
#   Gateway API: http://192.0.2.10:8090/v1/
#   CP API     : http://192.0.2.10:8090/api/
# ═══════════════════════════════════════════════════════════════════════════════

upstream aimeter_dev_gateway {
    server 127.0.0.1:8080;
}

upstream aimeter_dev_cp {
    server 127.0.0.1:8081;
}

# Vite 开发服务器（HTTPS + 自签证书）
upstream aimeter_dev_web {
    server 127.0.0.1:5173;
}

# HMR WebSocket 升级支持
map $http_upgrade $aimeter_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8090;
    listen [::]:8090;
    server_name _;

    # ─── LLM Gateway API（OpenAI 兼容接口） ──────────────────────────────────────
    location /v1/ {
        proxy_pass http://aimeter_dev_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
        chunked_transfer_encoding on;
    }

    location /health {
        proxy_pass http://aimeter_dev_gateway;
    }

    location /ready {
        proxy_pass http://aimeter_dev_gateway;
    }

    location /swagger/ {
        proxy_pass http://aimeter_dev_gateway;
    }

    # ─── Control Plane 管理 API ──────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://aimeter_dev_cp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ─── OAuth 前端回调（SPA 路由，交给 Vite 返回 index.html） ──────────────────────
    location = /auth/callback {
        proxy_pass https://aimeter_dev_web;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_ssl_name localhost;
        proxy_set_header Host $host;
    }

    # ─── OAuth 认证 API ───────────────────────────────────────────────────────────
    location /auth/ {
        proxy_pass http://aimeter_dev_cp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── 前端（Vite 开发服务器，含 HMR 热更新） ───────────────────────────────────
    location / {
        proxy_pass https://aimeter_dev_web;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_ssl_name localhost;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / HMR
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $aimeter_connection_upgrade;
        proxy_read_timeout 86400s;
    }
}
