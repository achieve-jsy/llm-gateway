# ═══════════════════════════════════════════════════════════════════════════════
# 测试环境 nginx 配置 — 无域名，通过 IP:端口 访问
#
# 部署方式：
#   ln -sf /home/hgf/code/llm_gateway/deploy/docker/nginx-test.conf /www/server/nginx/conf/vhost/aimeter-test.conf
#   nginx -t && nginx -s reload
#
# 访问地址：http://192.0.2.10:9080
# 前端静态文件目录：/var/www/aimeter-test/dist/
# ═══════════════════════════════════════════════════════════════════════════════

upstream aimeter_test_gateway {
    server 127.0.0.1:8080;
}

upstream aimeter_test_cp {
    server 127.0.0.1:8081;
}

server {
    listen 9080;
    listen [::]:9080;
    server_name _;

    root /var/www/aimeter-test/dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # ─── LLM Gateway API（OpenAI 兼容接口） ──────────────────────────────────────
    location /v1/ {
        proxy_pass http://aimeter_test_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
        chunked_transfer_encoding on;
    }

    location /health {
        proxy_pass http://aimeter_test_gateway;
    }

    location /ready {
        proxy_pass http://aimeter_test_gateway;
    }

    location /swagger/ {
        proxy_pass http://aimeter_test_gateway;
    }

    # ─── Control Plane 管理 API ──────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://aimeter_test_cp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ─── OAuth 前端回调（SPA 路由） ───────────────────────────────────────────────
    location = /auth/callback {
        try_files /index.html =404;
    }

    # ─── OAuth 认证 API ───────────────────────────────────────────────────────────
    location /auth/ {
        proxy_pass http://aimeter_test_cp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── 静态资源缓存 ────────────────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # ─── Vue SPA 回退 ────────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
