upstream gateway {
    server 127.0.0.1:8080;
    keepalive 64;              # 连接池复用，降低 TTFT
    keepalive_timeout 75s;
    keepalive_requests 1000;
}

upstream control_plane {
    server 127.0.0.1:8081;
    keepalive 32;
}

server {
    listen 9080;
    listen [::]:9080;
    server_name _;

    root /data/llm-gateway/web/;
    index index.html;

    client_max_body_size 0;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    location /v1/ {
        proxy_pass http://gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";        # 配合 upstream keepalive 复用连接

        # SSE 流式：全程关闭缓冲
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_max_temp_file_size 0;
        chunked_transfer_encoding on;
        gzip off;                              # 防止流式被压缩缓冲

        # 长连接超时
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # socket 级保活，及时发现死连接
        proxy_socket_keepalive on;
    }

    location /health {
        proxy_pass http://gateway;
    }

    location /ready {
        proxy_pass http://gateway;
    }

    location /swagger/ {
        proxy_pass http://gateway;
    }

    location /api/ {
        proxy_pass http://control_plane;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # WebSocket 代理（Ops Dashboard 实时 QPS/TPS 推送）
    location /api/v1/ops/ws/ {
        proxy_pass http://control_plane;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /auth/callback {
        try_files /index.html =404;
    }

    location /auth/ {
        proxy_pass http://control_plane;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
