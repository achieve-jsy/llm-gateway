# ═══════════════════════════════════════════════════════════════════════════════
# 宿主机 nginx 配置 — aimeter.xk-devops.com
#
# 部署方式：
#   ln -s /path/to/this/file /etc/nginx/conf.d/aimeter.conf
#   nginx -t && systemctl reload nginx
#
# 前端静态文件目录（Vue build 产物）：
#   /var/www/aimeter/dist/
# ═══════════════════════════════════════════════════════════════════════════════

upstream gateway {
    server 192.0.2.10:4010;
}

upstream control_plane {
    server 192.0.2.10:4011;
}

# ─── HTTP → HTTPS 重定向 ─────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name aimeter.xk-devops.com;
    return 301 https://$host$request_uri;
}

# ─── HTTPS 主服务 ────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aimeter.xk-devops.com;

    ssl_certificate     /etc/nginx/ssl/llm.xk-devops.com.pem;
    ssl_certificate_key /etc/nginx/ssl/llm.xk-devops.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /var/www/aimeter/dist;
    index index.html;

    client_max_body_size 0; # 不限制请求体大小，由上游模型 context window 约束

    # ─── Gzip ────────────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # ─── LLM Gateway API（OpenAI 兼容接口） ──────────────────────────────────────
    location /v1/ {
        proxy_pass http://gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;           # SSE streaming 支持
        chunked_transfer_encoding on;
    }

    # ─── Gateway 健康检查 & Swagger ──────────────────────────────────────────────
    location /health {
        proxy_pass http://gateway;
    }

    location /ready {
        proxy_pass http://gateway;
    }

    location /swagger/ {
        proxy_pass http://gateway;
    }

    # ─── Control Plane 管理 API ──────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://control_plane;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ─── OAuth 前端回调（SPA 路由，不转发到后端） ─────────────────────────────────
    location = /auth/callback {
        try_files /index.html =404;
    }

    # ─── OAuth 认证 API ───────────────────────────────────────────────────────────
    location /auth/ {
        proxy_pass http://control_plane;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── 前端静态资源（带缓存） ──────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ─── Vue SPA 回退 ────────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
