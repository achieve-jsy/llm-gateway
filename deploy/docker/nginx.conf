root@bfubuntu:~# cat /etc/nginx/sites-available/example-ai-meter.conf
# ═══════════════════════════════════════════════════════════════════════════════
# 宿主机 nginx 配置 — aimeter.xk-devops.com
#
# 部署方式：
#   ln -s /path/to/this/file /etc/nginx/conf.d/aimeter.conf
#   nginx -t && systemctl reload nginx
#
# 前端静态文件目录（Vue build 产物）：
#   /var/www/aimeter/dist/
# ═══════════════════════════════════════════════════════════════════════════════

upstream gateway {
    server 127.0.0.1:8080;
    keepalive 64;              # 连接池复用，降低 TTFT
    keepalive_timeout 75s;
    keepalive_requests 1000;
}

upstream control_plane {
    server 127.0.0.1:8081;
    keepalive 32;
}

# ─── HTTP → HTTPS 重定向 ─────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name aimeter.xk-devops.com;
    return 301 https://$host$request_uri;
}

# ─── HTTPS 主服务 ────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aimeter.xk-devops.com;

    ssl_certificate     /etc/nginx/ssl/llm.xk-devops.com.pem;
    ssl_certificate_key /etc/nginx/ssl/llm.xk-devops.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /data/web/aimeter/dist/;
    index index.html;
    
    client_max_body_size 0;  # 不限制请求体大小，由上游模型 context window 约束

    # ─── Gzip ────────────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # ─── LLM Gateway API（OpenAI 兼容接口） ──────────────────────────────────────
    location /v1/ {
        proxy_pass http://gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";        # 配合 upstream keepalive 复用连接

        # ─── SSE 流式：全程关闭缓冲 ────────────────────────────────────────────────
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_max_temp_file_size 0;
        chunked_transfer_encoding on;
        gzip off;                              # 防止流式被压缩缓冲

        # ─── 长连接超时 ───────────────────────────────────────────────────────────
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # ─── socket 级保活，及时发现死连接 ────────────────────────────────────────
        proxy_socket_keepalive on;
    }

    # ─── Gateway 健康检查 & Swagger ──────────────────────────────────────────────
    location /health {
        proxy_pass http://gateway;
    }

    location /ready {
        proxy_pass http://gateway;
    }

    location /swagger/ {
        proxy_pass http://gateway;
    }

    # ─── Control Plane 管理 API ──────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://control_plane;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ─── OAuth 前端回调（SPA 路由，不转发到后端） ─────────────────────────────────
    location = /auth/callback {
        try_files /index.html =404;
    }

    # ─── OAuth 认证 API ───────────────────────────────────────────────────────────
    location /auth/ {
        proxy_pass http://control_plane;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── 前端静态资源（带缓存） ──────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ─── Vue SPA 回退 ────────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
