worker_processes 1;

events { worker_connections 1024; }

http {
    include /opt/homebrew/etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 443 ssl;
        server_name aimeter.xk-devops.com;

        ssl_certificate     /Users/jsy/Public/self_code/llm-gateway/web/certs/localhost.crt;
        ssl_certificate_key /Users/jsy/Public/self_code/llm-gateway/web/certs/localhost.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            proxy_pass https://127.0.0.1:5173;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}