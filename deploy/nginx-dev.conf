worker_processes 1;

events { worker_connections 1024; }

http {
    include /opt/homebrew/etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 0; # 不限制请求体大小，由上游模型 context window 约束

    # ─── localhost:5173 — 本地开发入口（HTTPS） ───────────────────────────
    server {
        listen 5173 ssl;
        server_name localhost 127.0.0.1;

        ssl_certificate     /Users/jsy/Public/self_code/llm-gateway/web/certs/localhost.crt;
        ssl_certificate_key /Users/jsy/Public/self_code/llm-gateway/web/certs/localhost.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location /v1/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
            proxy_buffering off;
            chunked_transfer_encoding on;
        }
        location /health { proxy_pass http://127.0.0.1:8080; }
        location /api/ {
            proxy_pass http://127.0.0.1:8081;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
        }
        location /auth/ {
            proxy_pass http://127.0.0.1:8081;
            proxy_set_header Host $host;
        }
        location / {
            root /Users/jsy/Public/self_code/llm-gateway/web/dist;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }

    # ─── aimeter.xk-devops.com — HTTPS 入口 ─────────────────────────────
    server {
        listen 443 ssl;
        server_name aimeter.xk-devops.com;

        ssl_certificate     /Users/jsy/Public/self_code/llm-gateway/web/certs/localhost.crt;
        ssl_certificate_key /Users/jsy/Public/self_code/llm-gateway/web/certs/localhost.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # ─── LLM Gateway API（OpenAI 兼容接口） ──────────────────────────
        location /v1/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_buffering off;
            chunked_transfer_encoding on;
        }

        # ─── Gateway 健康检查 & Swagger ──────────────────────────────────
        location /health { proxy_pass http://127.0.0.1:8080; }
        location /ready  { proxy_pass http://127.0.0.1:8080; }
        location /swagger/ { proxy_pass http://127.0.0.1:8080; }

        # ─── Control Plane 管理 API ─────────────────────────────────────
        location /api/ {
            proxy_pass http://127.0.0.1:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        # ─── OAuth 认证 API ─────────────────────────────────────────────
        location /auth/ {
            proxy_pass http://127.0.0.1:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ─── 前端静态文件（构建产物） ────────────────────────────────────
        location / {
            root /Users/jsy/Public/self_code/llm-gateway/web/dist;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}