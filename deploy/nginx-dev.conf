worker_processes 1;

events { worker_connections 1024; }

http {
    include /opt/homebrew/etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 443 ssl;
        server_name aimeter.xk-devops.com;

        ssl_certificate     /Users/jsy/Public/self_code/llm-gateway/web/certs/localhost.crt;
        ssl_certificate_key /Users/jsy/Public/self_code/llm-gateway/web/certs/localhost.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # ─── LLM Gateway API（OpenAI 兼容接口） ──────────────────────────
        location /v1/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_buffering off;
            chunked_transfer_encoding on;
        }

        # ─── Gateway 健康检查 & Swagger ──────────────────────────────────
        location /health { proxy_pass http://127.0.0.1:8080; }
        location /ready  { proxy_pass http://127.0.0.1:8080; }
        location /swagger/ { proxy_pass http://127.0.0.1:8080; }

        # ─── Control Plane 管理 API ─────────────────────────────────────
        location /api/ {
            proxy_pass http://127.0.0.1:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        # ─── OAuth 前端回调（SPA） ───────────────────────────────────────
        location = /auth/callback {
            proxy_pass https://127.0.0.1:5173;
        }

        # ─── OAuth 认证 API ─────────────────────────────────────────────
        location /auth/ {
            proxy_pass http://127.0.0.1:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ─── 前端 Vite ──────────────────────────────────────────────────
        location / {
            proxy_pass https://127.0.0.1:5173;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}