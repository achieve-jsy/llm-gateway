version: "3.9"

# ═══════════════════════════════════════════════════════════════════════════════
# 生产部署 docker-compose
#
# 架构：宿主机 Nginx（HTTPS）→ 按路径反代到容器端口
#   /v1/*         → 127.0.0.1:8080 (gateway)
#   /api/*        → 127.0.0.1:8081 (control-plane)
#   /auth/*       → 127.0.0.1:8081 (control-plane)
#   /*            → /var/www/aimeter/dist/ (宿主机静态文件)
#
# 使用方式：
#   1. cp .env.example .env && 编辑 .env 填入实际配置
#   2. docker compose build
#   3. docker compose up -d
#   4. 将 deploy/docker/nginx.conf 软链到 /etc/nginx/conf.d/aimeter.conf
#   5. 将前端 build 产物部署到 /var/www/aimeter/dist/
#
# 如需自带 PostgreSQL/Redis（测试用），请使用 docker-compose.dev.yml
# 如需 OTEL + Jaeger：docker compose --profile observability up -d
# ═══════════════════════════════════════════════════════════════════════════════

services:
  # ─── LLM Gateway（代理转发层） ─────────────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: deploy/docker/gateway.Dockerfile
    image: llm-gateway:${IMAGE_TAG:-latest}
    container_name: llm-gw-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      APP_ENV: prod
      GATEWAY_PORT: "8080"
      DATABASE_URL: ${DATABASE_URL}
      REDIS_ADDR: ${REDIS_ADDR}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      JWT_SECRET: ${JWT_SECRET}
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 120s
    deploy:
      resources:
        limits:
          memory: 1g

  # ─── Control Plane（管理后端 API） ─────────────────────────────────────────────
  control-plane:
    build:
      context: .
      dockerfile: deploy/docker/control-plane.Dockerfile
    image: llm-control-plane:${IMAGE_TAG:-latest}
    container_name: llm-gw-control-plane
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      APP_ENV: prod
      CONTROL_PLANE_PORT: "8081"
      DATABASE_URL: ${DATABASE_URL}
      REDIS_ADDR: ${REDIS_ADDR}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      JWT_SECRET: ${JWT_SECRET}
      OAUTH_ISSUER_URL: ${OAUTH_ISSUER_URL:-}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:-}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:-}
      OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/api/v1/provider-definitions"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m

  # ─── OpenTelemetry Collector（可选） ───────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: llm-gw-otel
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    profiles:
      - observability

  # ─── Jaeger（可选，trace 可视化） ──────────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.54
    container_name: llm-gw-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
    profiles:
      - observability
