version: "3.9"

# ═══════════════════════════════════════════════════════════════════════════════
# 生产部署 docker-compose
#
# 架构：宿主机 Nginx（HTTPS）→ 按路径反代到容器端口
#   /v1/*         → 127.0.0.1:8080 (gateway)
#   /api/*        → 127.0.0.1:8081 (control-plane)
#   /auth/*       → 127.0.0.1:8081 (control-plane)
#   /*            → /var/www/aimeter/dist/ (宿主机静态文件)
#
# 使用方式：
#   1. docker compose up -d
#   2. 将 deploy/docker/nginx.conf 软链到 /etc/nginx/conf.d/aimeter.conf
#   3. 将前端 build 产物部署到 /var/www/aimeter/dist/
#
# 如需自带 PostgreSQL/Redis（测试用），请使用 docker-compose.dev.yml
# 如需 OTEL + Jaeger：docker compose --profile observability up -d
# ═══════════════════════════════════════════════════════════════════════════════

services:
  # ─── LLM Gateway（代理转发层） ─────────────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: deploy/docker/gateway.Dockerfile
    image: ${REGISTRY:-192.0.2.10:5000}/llm-gateway:${IMAGE_TAG:-latest}
    container_name: llm-gw-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_HOST:-127.0.0.1}:${GATEWAY_PORT:-8080}:8080"
    environment:
      APP_ENV: ${APP_ENV:-prod}
      REDIS_ADDR: ${REDIS_ADDR:-172.17.0.1:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-CHANGE_ME_REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB:-0}
      INTERNAL_TOKEN: ${INTERNAL_AUTH_TOKEN:-dev-test-token}
      CONTROL_PLANE_URL: http://llm-gw-control-plane:8081
      AUTH_URL: http://llm-gw-control-plane:8081
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g

  # ─── Control Plane（管理后端 API） ─────────────────────────────────────────────
  control-plane:
    build:
      context: .
      dockerfile: deploy/docker/control-plane.Dockerfile
    image: ${REGISTRY:-192.0.2.10:5000}/llm-control-plane:${IMAGE_TAG:-latest}
    container_name: llm-gw-control-plane
    restart: unless-stopped
    ports:
      - "${CP_HOST:-127.0.0.1}:${CONTROL_PLANE_PORT:-8081}:8081"
    environment:
      APP_ENV: ${APP_ENV:-prod}
      DATABASE_URL: ${DATABASE_URL:-host=172.17.0.1 port=5432 user=llm_gateway_test password=CHANGE_ME_PASSWORD dbname=llm_gateway_test sslmode=disable}
      REDIS_ADDR: ${REDIS_ADDR:-172.17.0.1:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-CHANGE_ME_REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB:-0}
      JWT_SECRET: ${JWT_SECRET:-d8f7a3b2c1e9f4567890abc123def456}
      INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN:-dev-test-token}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-12345678901234567890123456789012}
      OAUTH_ISSUER_URL: ${OAUTH_ISSUER_URL:-https://oauth.example.net/}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:-5514f6bb0a}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:-CHANGE_ME_OAUTH_SECRET}
      OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI:-http://192.0.2.10:9080/auth/callback}
      OAUTH_SCOPES: ${OAUTH_SCOPES:-openid profile email}
      FRONTEND_URL: ${FRONTEND_URL:-http://192.0.2.10:9080}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m

  # ─── OpenTelemetry Collector（可选） ───────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: llm-gw-otel
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    profiles:
      - observability

  # ─── Jaeger（可选，trace 可视化） ──────────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.54
    container_name: llm-gw-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
    profiles:
      - observability
