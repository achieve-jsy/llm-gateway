version: "3.9"

# ═══════════════════════════════════════════════════════════════════════════════
# 部署 docker-compose
#
# 使用 network_mode: host，容器直接用宿主机网络栈：
#   - PG/Redis 通过 127.0.0.1 直连，无需 docker bridge 地址映射
#   - 端口直接暴露在宿主机上，无需 ports 映射
#   - 容器间互访也用 127.0.0.1
#
# 如需自带 PostgreSQL/Redis（测试用），请使用 docker-compose.dev.yml
# 如需 OTEL + Jaeger：docker compose --profile observability up -d
# ═══════════════════════════════════════════════════════════════════════════════

services:
  # ─── LLM Gateway（代理转发层） ─────────────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: deploy/docker/gateway.Dockerfile
    image: ${REGISTRY:-192.0.2.10:5000}/llm-gateway:${IMAGE_TAG:-latest}
    container_name: llm-gw-gateway
    restart: unless-stopped
    network_mode: host
    environment:
      APP_ENV: ${APP_ENV:-prod}
      GATEWAY_PORT: ${GATEWAY_PORT:-8080}
      REDIS_ADDR: ${REDIS_ADDR:-127.0.0.1:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required (CI/CD 变量注入)}
      REDIS_DB: ${REDIS_DB:-0}
      INTERNAL_TOKEN: ${INTERNAL_AUTH_TOKEN:?INTERNAL_AUTH_TOKEN required (CI/CD 变量注入)}
      AUTH_INTERNAL_TOKEN: ${INTERNAL_AUTH_TOKEN:?INTERNAL_AUTH_TOKEN required (CI/CD 变量注入)}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required (CI/CD 变量注入)}
      CONTROL_PLANE_URL: http://127.0.0.1:${CONTROL_PLANE_PORT:-8081}
      AUTH_URL: http://127.0.0.1:${CONTROL_PLANE_PORT:-8081}
    volumes:
      # 长语法（不是 `-v`）：source/target 显式，且**绝不**让 Docker 去创建宿主路径。
      # 部署前必须先 `findmnt -T /datalog` 证明挂载在场（见计划 4 任务 6 步骤 5）。
      # 【根编排只给挂载、不给开关】没有颜色概念 ⇒ 这里不写任何生效的 TRACE_BODY_ 系列键
      # （门禁口径是「非注释生效行 = 0」，见计划 4 E68①；文本 grep 不是门禁）：
      # 设了「写侧开关」而配套的「实例名」缺失，等于再造一个写者到 inst 未定义、
      # 启动直接失败的状态。完整键名见 deploy/blue-green 的两份颜色编排。
      - type: bind
        source: /datalog
        target: /datalog
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:${GATEWAY_PORT:-8080}/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 2g

  # ─── Control Plane（管理后端 API） ─────────────────────────────────────────────
  control-plane:
    build:
      context: .
      dockerfile: deploy/docker/control-plane.Dockerfile
    image: ${REGISTRY:-192.0.2.10:5000}/llm-control-plane:${IMAGE_TAG:-latest}
    container_name: llm-gw-control-plane
    restart: unless-stopped
    network_mode: host
    environment:
      APP_ENV: ${APP_ENV:-prod}
      CONTROL_PLANE_PORT: ${CONTROL_PLANE_PORT:-8081}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required (CI/CD 变量注入)}
      REDIS_ADDR: ${REDIS_ADDR:-127.0.0.1:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required (CI/CD 变量注入)}
      REDIS_DB: ${REDIS_DB:-0}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required (CI/CD 变量注入)}
      INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN:?INTERNAL_AUTH_TOKEN required (CI/CD 变量注入)}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY required (CI/CD 变量注入)}
      OAUTH_ISSUER_URL: ${OAUTH_ISSUER_URL:-https://oauth.example.net/}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:?OAUTH_CLIENT_ID required (CI/CD 变量注入)}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:?OAUTH_CLIENT_SECRET required (CI/CD 变量注入)}
      OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI:-http://192.0.2.10:9080/auth/callback}
      OAUTH_SCOPES: ${OAUTH_SCOPES:-openid profile email}
      FRONTEND_URL: ${FRONTEND_URL:-http://192.0.2.10:9080}
    volumes:
      # 控制面只点读（冻结包 reader 全程不写文件）⇒ 只读挂载即可。
      - type: bind
        source: /datalog
        target: /datalog
        read_only: true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:${CONTROL_PLANE_PORT:-8081}/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m

  # ─── OpenTelemetry Collector（可选） ───────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: llm-gw-otel
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    profiles:
      - observability

  # ─── Jaeger（可选，trace 可视化） ──────────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.54
    container_name: llm-gw-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
    profiles:
      - observability
