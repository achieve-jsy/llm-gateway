id: "CHG-20260525-001"
name: "模型组 + 智能调度（路由/负载/健康/切换）"
status: "in-progress"
phase: "design"
created_at: "2026-05-25"
updated_at: "2026-05-25"
scope:
  include: "模型组 CRUD（创建/编辑/删除）、组内模型管理（添加/移除、跨组允许）、每组独立路由策略配置（轮询/优先级/权重）、组名调用入口（替代模型名直传）、组内负载均衡、渠道/模型实时健康探测、故障自动切换至同组可用模型"
  exclude: "模型组权限管控（部门/角色可见性）、调用统计与用量报表、组级别的限额策略、多级模型组嵌套、健康检查失败后的自动回切策略"
affected_modules:
  - name: "scheduler"
    change_type: "added"
    module_type: "web-backend"
    summary: "新增 scheduler 模块：组内路由决策、负载均衡（轮询/优先级/权重）、实时健康探测、秒级故障切换"
  - name: "control-plane"
    change_type: "modified"
    module_type: "web-backend"
    summary: "新增模型组 CRUD 接口（创建/编辑/删除）、组内模型管理、每组路由策略配置"
  - name: "gateway-api"
    change_type: "modified"
    module_type: "web-backend"
    summary: "组名解析替代模型名直传、调用时委托 scheduler 选择组内目标模型、组名不存在或组内无可用模型时的错误处理"
  - name: "ops-console"
    change_type: "modified"
    module_type: "web-frontend"
    summary: "新增模型组管理页面（组列表/创建/编辑/删除）、组内模型编辑面板、路由策略配置界面"