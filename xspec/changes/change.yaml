name: "用量采集与成本估算"
description: "上线调用埋点与用量聚合，配置模型定价后换算成本估算，在个人用量页呈现——让每个员工一眼看清自己用了多少、花了多少"

status: "in-progress"
phase: "implement"

project_profile: "llm-gateway"

priority: "P0"
