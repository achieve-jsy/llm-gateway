scope:
  include:
    - "Bootstrap 初始管理员：通过 BOOTSTRAP_ADMIN 环境变量预置首个 admin，SSO 首次登录自动授予，系统已有 admin 后通道自动失效，授予动作写审计"
    - "四级组织实体：公司→工作室→部门→员工，一人一部门、一部门一工作室（本期不做一人多部门）"
    - "部门↔工作室映射维护：独立 dept_studio_map 表；支持 CSV 批量导入 + 后台手工维护；映射缺失时员工标记 pending_studio"
    - "SSO 登录自动归集：OAuth 回调解析 dept_id，upsert 组织节点，幂等，部门变更写迁移日志"
    - "RBAC 四角色：user / dept_admin / studio_admin / admin，角色绑定组织节点，上级才能指定下级，卸任回退 user"
    - "管辖域鉴权：每个管理操作校验 target_scope 是否在当前用户管辖域内，越权 403"
    - "未映射部门处理：pending_studio 员工调用模型被前置拒绝，管理员可查看「未映射部门」清单"
    - "分层用量看板：个人看板（全员）+ 管理看板（管理角色），复用 usage_daily，面包屑下钻 公司→工作室→部门→成员"
    - "组织管理 UI：树形组织视图、映射维护页（批量导入+手工）、角色管理页"
  exclude:
    - "预算/额度（见额度权限篇）"
