    - "一人多部门 / 任意深度组织树（v1.x）"
    - "审计日志完整实现（v0.8.0，仅预留 actor_id 字段）"
    - "自定义角色、细粒度权限点（v1.x）"
    - "一人多角色叠加（v1.x）"

