id: "CHG-20260603-001"
name: "调用埋点、用量汇总与成本追踪"
status: "in-progress"
phase: "implement"
created_at: "2026-06-03"
updated_at: "2026-06-03"
scope:
  include: "gateway-api 每次调用后异步写入埋点事件（模型/Token数/耗时/状态/Key/部门维度）；埋点事件消费后按天/小时/月汇总用量（usage_daily，预留 dept_id/studio_id 维度）；control-plane 模型定价配置扩展（输入/输出单价、阶梯定价、历史单价锁定）；用量按单价换算估算成本；按 Key/时间/模型/部门筛选的成本查询接口，支持 CSV/Excel 导出"
  exclude: "ops-console 前端成本看板（后续单独推进）；预算预警；厂商账单精确对账；流式调用中实时累计成本（仅在调用结束时计算）；定价变更重算历史成本"
affected_modules:
  - name: "observability-hub"
    change_type: "added"
    module_type: "web-backend"
    summary: "埋点事件消费与存储、按天/小时/月用量汇总、模型定价数据存储、成本估算与查询接口（按 Key/时间/模型/部门筛选）、CSV/Excel 导出"
  - name: "gateway-api"
    change_type: "modified"
    module_type: "web-backend"
    summary: "每次模型调用完成后异步写入埋点事件（模型/Token数/耗时/状态/Key/部门维度），通过 Redis 队列发送到 observability-hub"
  - name: "control-plane"
    change_type: "modified"
    module_type: "web-backend"
    summary: "模型定价配置扩展：输入/输出单价、阶梯定价规则、历史单价快照与锁定"