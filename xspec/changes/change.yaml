updated_at: "2026-06-03"
author: "TBD"

source_doc: "v0.4.0 产品规格 C1 + C2"

scope:
  include:
    - "调用埋点采集：每次请求异步记录 UsageEvent（Token 含 reasoning/cached 分桶、TTFT/延迟细分、provider 路由信息、stream 标记、session_id）"
    - "流式 usage 采集：注入 include_usage 解析末尾 chunk，与非流式同口径，回填 reasoning_tokens"
    - "身份解析：Key 验证时解析完整身份链（key→user→dept），dept_id 从 SSO 直接获取"
    - "成本估算引擎：多桶计价 EstimateCost（prompt/completion/reasoning/cached 分桶单价，对齐 LiteLLM），采集时锁价"
    - "按天聚合 Rollup：每小时整日重算幂等 upsert → usage_daily，reasoning_tokens/cached_tokens 纳入分桶求和"
    - "只读用量查询 API：GET /v1/usage，三级数据视角（管理员/部门/个人），返回 TTFT/延迟指标"
    - "模型定价多桶：catalog 同步导入 reasoning/cached 分桶价格；ResolveModelPricing 返回多桶报价；手动模式支持多桶填价"
    - "调用内容记录层：全量记录请求 messages + 响应正文（call_payloads），PG 直存"
    - "个人用量页：总量/按模型/调用次数/成本估算 + TTFT/延迟趋势（日/周/月）+ 高消耗定位"
    - "全局用量看板：管理员视角全公司用量概览（雏形），含延迟指标"
    - "Catalog UI 简化：删价格差异 tab + 模型增 price_mode 开关 + 多桶定价输入框"
  exclude:
    - "限速与配额管控 / 硬限额拦截（v0.5.0）"
    - "额度预警与拦截（v0.5.0）"
    - "调用明细的前端页面（v0.8.0）"
    - "成本分摊与财务对账 / 真实计费（v1.0+）"
    - "ClickHouse / Kafka 等 OLAP / 流式基础设施"
    - "剩余额度展示"
    - "PII 脱敏（预留开关位，当前不启用）"

